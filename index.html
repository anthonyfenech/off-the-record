    <!-- Emergency overlay cleanup - runs before anything else -->
    <script>
        (function() {
            // Immediately clear any stuck overlay states from previous sessions
            document.addEventListener('DOMContentLoaded', function() {
                // Remove active class from all overlays including lightbox
                var overlays = document.querySelectorAll('.overlay, .lightbox-overlay, .media-modal-overlay, .photo-modal-overlay, [class*="overlay"], [id*="overlay"]');
                overlays.forEach(function(el) {
                    el.classList.remove('active');
                    el.style.pointerEvents = 'none';
                    el.style.display = 'none';
                    el.style.visibility = 'hidden';
                });
                // Ensure body scroll is not locked
                document.body.style.overflow = '';
            });
        })();
    </script>

    <style>
        /* Hide menu and theme toggle on home page only */
        .home-page .menu-btn,

        /* === PARAGRAPH FORMATTING === */
        .chapter-body p {
            text-indent: 0.5in !important;
            text-align: justify !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.6;
        }

        .chapter-body p:empty {
            height: 1em;
            margin: 0 !important;
            padding: 0 !important;
        }

        .chapter-body p:first-child {
            text-indent: 0 !important;
        }

        .chapter-body .dateline {
            font-weight: 500;
        }

        .chapter-body p.headline-block {
            text-indent: 0 !important;
        }

        .chapter-body .block-quote p {
            text-indent: 0 !important;
            margin-left: 2em !important;
        }

        /* Mobile: smaller indent, left-aligned for readability */
        @media (max-width: 600px) {
            .chapter-body p {
                text-indent: 24px !important;
                text-align: left !important;
            }
        }

        .home-cover-img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            /* Height-fit on desktop, ~10% smaller than before:
               was calc(100vh - 220px) ≈ 680px on a 900px viewport;
               now calc(100vh - 290px) ≈ 610px = ~10% reduction. */
            max-height: calc(100vh - 290px);
            aspect-ratio: 1 / 1.6;
            object-fit: contain;
            margin: 0 auto;
            cursor: pointer !important;   /* beats .chapter-body img:not(...){cursor:zoom-in} (0,3,1) */
        }
        /* Desktop-only: nudge cover UP — drop the .home-content padding-top
           from calc(var(--space-2xl) + 12vh) to calc(var(--space-2xl) + 4vh)
           so the cover sits closer to the header (still a small breathing room,
           not jammed to the top). Mobile keeps its default padding. */
        @media (min-width: 601px) {
            .home-content:has(.home-cover-img) {
                padding-top: calc(var(--space-2xl) + 4vh);
            }
            /* End-of-book cover: drop the desktop nudge so the cover isn't
               pushed down inside the chapter viewport. Reuse .home-cover-img
               sizing untouched. */
            .home-content.cover-back {
                padding-top: 0;
            }
        }
        /* Mobile: width-fit (fills viewport width, aspect-ratio preserved). */
        @media (max-width: 600px) {
            .home-cover-img {
                max-height: none;
                width: 100%;
            }
        }
        /* End-of-book cover image: not a button → no pointer cursor. */
        .cover-back-img {
            cursor: default !important;   /* beats the inherited .home-cover-img pointer */
            pointer-events: none;          /* clicks never fire → lightbox handler can't open */
        }

    <!-- Continue Reading CTA: hijack CONTINUE READING button when bookmark exists -->
    <script>
    (function(){
        function initContinueReadingCTA() {
            if (!window.bookmark) return;
            var bookmark = window.bookmark.get();
            if (!bookmark || !bookmark.chapterSlug) return;

            var ctaBtn = document.querySelector('.start-reading-btn') || document.getElementById('startReadingBtn');
            if (!ctaBtn) return;

            // Change button text to show continue reading
            ctaBtn.textContent = 'CONTINUE READING';

            // Override click to go to bookmarked position
            ctaBtn.onclick = function(e) {
                e.preventDefault();
                sessionStorage.setItem('scrollToPercent', String(bookmark.scrollPercent));
                window.location.hash = bookmark.chapterSlug;
            };
        }

        window.addEventListener('homePageLoaded', initContinueReadingCTA);

        // Also check on DOMContentLoaded in case home page is already showing
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                if (document.querySelector('.home-content')) initContinueReadingCTA();
            });
        } else if (document.querySelector('.home-content')) {
            initContinueReadingCTA();
        }
    })();
    </script>

    <!-- Reader Odometer (scoreboard-style counter) -->
    <script>
    (function(){
      var DIGITS = 7;
      var housing = null;
      var reels = [];
      var odometerEl = null;

      function getDigitColor(){
        return document.documentElement.getAttribute('data-theme')==='dark' ? '#999' : '#666';
      }

      function updateDigitColors(){
        // Colors now handled by CSS
      }

      function createOdometer(){
        odometerEl = document.createElement('div');
        odometerEl.id = 'reader-odometer';
        odometerEl.style.cssText = 'display:none;text-align:center;margin-top:2em;';

        housing = document.createElement('div');
        housing.id = 'odo-housing';
        housing.style.cssText = 'background:transparent;padding:0;align-items:center;';

        odometerEl.appendChild(housing);
      }

      function buildReels(){
        if(!housing) return;
        housing.innerHTML = '';
        reels = [];
        for(var i=0;i<DIGITS;i++){
          var digit = document.createElement('div');
          digit.className = 'odo-digit';
          digit.textContent = '0';
          housing.appendChild(digit);
          reels.push(digit);
        }
      }

      function showTotal(n, animate){
        var s=String(Math.min(Math.max(0,n),9999999)).padStart(DIGITS,'0');
        for(var i=0;i<DIGITS;i++){
          reels[i].textContent = s[i];
        }
        if(odometerEl) odometerEl.style.display='block';
      }

      function insertOdometer(){
        var homeContent = document.querySelector('.home-content');
        if(homeContent && odometerEl && !document.getElementById('reader-odometer')){
          var btn = homeContent.querySelector('.start-reading-btn');
          if(btn && btn.parentNode){
            btn.parentNode.insertBefore(odometerEl, btn.nextSibling);
          } else {
            homeContent.appendChild(odometerEl);
          }
        }
      }

      function fetchAndShow(){
        if(localStorage.getItem('admin_readerCounterEnabled') !== 'true') return;
        if(typeof OTR_ANALYTICS_CONFIG === 'undefined') return;
        var url = OTR_ANALYTICS_CONFIG.readerCounterUrl + '?action=getReaderCount';
        fetch(url).then(function(r){return r.json();}).then(function(data){
          var total = (data.total||0) + (data.manual_total||0);
          if(total>0){
            insertOdometer();
            showTotal(total);
            try { localStorage.setItem('otr_reader_count', total.toString()); } catch(e){}
          }
        }).catch(function(){
          if(odometerEl) odometerEl.style.display='none';
        });
      }

      // Initialize
      createOdometer();
      buildReels();
      showTotal(0,false);

      // Show cached count instantly (before fetch completes)
      var cachedCount = (function(){ try { return localStorage.getItem('otr_reader_count'); } catch(e){ return null; } })();
      if(cachedCount && document.querySelector('.home-content')){
        insertOdometer();
        showTotal(parseInt(cachedCount,10));
      }

      // Watch for theme changes
      var observer = new MutationObserver(function(mutations){
        for(var i=0;i<mutations.length;i++){
          if(mutations[i].attributeName==='data-theme'){
            updateDigitColors();
            break;
          }
        }
      });
      observer.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

      if(document.querySelector('.home-content')){
        fetchAndShow();
      }

      window.addEventListener('homePageLoaded', function(){
        fetchAndShow();
      });
    })();
    </script>
