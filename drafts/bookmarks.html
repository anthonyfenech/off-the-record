<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks - DRAFT</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        body {
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .draft-banner {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .bookmark-list {
            list-style: none;
            padding: 0;
        }
        .bookmark-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--color-border);
        }
        .empty-state {
            color: var(--color-text-secondary);
            font-style: italic;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="draft-banner">Draft - Not Published</div>

    <h1>Bookmarks</h1>

    <div id="bookmarksList">
        <p class="empty-state">Loading bookmarks...</p>
    </div>

    <a href="../admin.html" class="back-link">&larr; Back to Admin</a>

    <script type="module">
        const STORAGE_KEY = 'otr_bookmarks';

        function loadBookmarks() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            } catch (error) {
                return [];
            }
        }

        function renderBookmarks() {
            const container = document.getElementById('bookmarksList');
            const bookmarks = loadBookmarks();

            if (bookmarks.length === 0) {
                container.innerHTML = '<p class="empty-state">No bookmarks yet. Bookmarks will appear here when the feature is enabled.</p>';
                return;
            }

            const list = document.createElement('ul');
            list.className = 'bookmark-list';

            bookmarks.forEach(b => {
                const item = document.createElement('li');
                item.className = 'bookmark-item';
                item.innerHTML = `
                    <strong>${b.chapterTitle}</strong>
                    ${b.pageNumber ? `<br><small>Page ${b.pageNumber}${b.totalPages ? ` of ${b.totalPages}` : ''}</small>` : ''}
                `;
                list.appendChild(item);
            });

            container.innerHTML = '';
            container.appendChild(list);
        }

        renderBookmarks();
    </script>
</body>
</html>
