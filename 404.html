<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#333333">

    <title>Page Not Found — OFF-THE-RECORD</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/variables.min.css?v=423">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'EB Garamond', Georgia, serif;
            background: var(--color-background);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 400px;
            margin-bottom: 32px;
            color: var(--color-text-secondary);
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .links a {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-secondary);
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Inherit theme from localStorage
        (function() {
            if (localStorage.getItem('reader_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <h1>Page Not Found</h1>
    <p>That page doesn't exist.</p>

        <a href="/about.html" aria-label="Author — Anthony Fenech">AUTHOR</a>
        <a href="/guestbook.html">GUESTBOOK</a>
    </nav>
</body>
</html>
