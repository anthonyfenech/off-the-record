<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Range - OFF-THE-RECORD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #fff; line-height: 1.5; font-size: 14px; }
        h1 { text-align: center; margin-bottom: 30px; }
        .prompt-section { background: #fff; padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .prompt-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .prompt-number { font-weight: bold; }
        .prompt-status { color: #888; }
        .prompt-status.answered { color: #000; }
        .prompt-title { font-weight: bold; margin-bottom: 10px; }
        .prompt-context { color: #444; margin-bottom: 15px; }
        .trigger-line { height: 2px; background: #ff0000; margin: 15px 0; }
        .prompt-outcome { color: #444; font-style: italic; }
        .reset-btn { position: fixed; top: 10px; right: 10px; background: #ff0000; color: #fff; border: none; padding: 8px 15px; cursor: pointer; font-size: 12px; z-index: 100; }
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        .modal { background: #fff; width: 90%; max-width: 260px; padding: 20px; position: relative; }
        .modal.wide { max-width: 400px; }
        .modal-close { position: absolute; top: 5px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer; }
        .modal-question { font-weight: bold; margin-bottom: 15px; }
        .modal-choices { margin-bottom: 15px; }
        .modal-choice { display: block; padding: 5px 0; cursor: pointer; }
        .modal-choice input { margin-right: 8px; }
        .modal-choice label { cursor: pointer; }
        .modal-input { width: 100%; padding: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 14px; margin-bottom: 10px; resize: vertical; min-height: 60px; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 8px; cursor: pointer; font-size: 13px; }
        .modal-btn.submit { background: #000; color: #fff; border: none; }
        .modal-btn.skip { background: #fff; color: #000; border: 1px solid #999; }
        .end-section { text-align: center; padding: 30px; color: #888; }
    </style>
</head>
<body>

<button class="reset-btn" onclick="resetAll()">RESET ALL</button>

<h1>DRIVING RANGE</h1>

<div id="prompts-container"></div>

<div class="end-section">END OF PROMPTS</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-question" id="modalQuestion"></div>
        <div class="modal-choices" id="modalChoices"></div>
        <div class="modal-buttons">
            <button class="modal-btn skip" id="btnSkip">SKIP</button>
            <button class="modal-btn submit" id="btnSubmit">SUBMIT</button>
        </div>
    </div>
</div>

<script>
const PROMPTS = [
    {
        id: 'verlander-camera',
        title: 'Verlander Camera Confrontation',
        context: 'Verlander blew you off. Now you\'re in a press scrum with TV cameras rolling.',
        question: 'What would you do?',
        type: 'choice',
        choices: ['Nothing', 'Call him out privately', 'Call him out on camera'],
        outcome: 'I asked it on-camera because I knew that\'s what he cared about most.'
    },
    {
        id: 'verlander-trade',
        title: 'Verlander Trade Tweet',
        context: 'Source confirmed: Verlander traded to Houston. You have 11 seconds.',
        question: 'What do you tweet?',
        type: 'text',
        outcome: '"The Tigers have traded Justin Verlander to the Astros." First by 2 minutes 27 seconds.'
    },
    {
        id: 'astros-clubhouse',
        title: 'Astros Clubhouse Decision',
        context: 'Day after Verlander called you unethical on national TV. You have clubhouse access.',
        question: 'Should I go in?',
        type: 'choice',
        choices: ['Yes', 'No', 'Of course'],
        outcome: 'Of course you went in. History will be on your side.'
    },
    {
        id: 'pizza-resignation',
        title: 'Pizza Resignation',
        context: 'Frozen out. Humiliated. You woke up feeling dangerous. Jet\'s Pizza is on speed dial.',
        question: 'How should I quit?',
        type: 'choice',
        choices: ['Fax', 'Twitter tirade', 'Send the Tigers a pizza'],
        outcome: 'I sent them pizza. Career suicide. Worth it.'
    },
    {
        id: 'vmart-hospital',
        title: 'V-Mart Hospital Text',
        context: 'Your V-Mart story drops at 2 AM. Ausmus texts: "Hold off." Says V-Mart is in the hospital.',
        question: 'What do you text back?',
        type: 'text',
        outcome: '"What the fuck, man?" Story killed. (Never confirmed V-Mart was actually hospitalized.)'
    }
];

const STORAGE_KEY = 'driving_range_answered';
let currentPromptId = null;
let selectedChoice = null;

function getAnswered() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
}
function setAnswered(id) {
    const answered = getAnswered();
    answered[id] = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(answered));
}

function loadAdminPrompts() {
    try {
        const admin = JSON.parse(localStorage.getItem('admin_interactivePrompts') || '[]');
        return admin.map((p, i) => ({
            id: 'admin-' + i,
            title: 'Q&A: ' + (p.question || '').substring(0, 30),
            context: '',
            question: p.question,
            type: 'choice',
            choices: p.choices ? p.choices.map(c => c.text) : [],
            outcome: 'Response recorded.'
        }));
    } catch { return []; }
}

function renderPrompts() {
    const container = document.getElementById('prompts-container');
    const answered = getAnswered();
    const allPrompts = [...PROMPTS, ...loadAdminPrompts()];

    container.innerHTML = allPrompts.map((p, i) => `
        <div class="prompt-section" id="section-${p.id}">
            <div class="prompt-header">
                <span class="prompt-number">#${i + 1}</span>
                <span class="prompt-status ${answered[p.id] ? 'answered' : ''}">${answered[p.id] ? '&#10003; Answered' : '&#9675; Not answered'}</span>
            </div>
            <div class="prompt-title">${p.title}</div>
            ${p.context ? `<div class="prompt-context">${p.context}</div>` : ''}
            <div class="trigger-line" data-prompt-id="${p.id}"></div>
            <div class="prompt-outcome">${p.outcome}</div>
        </div>
    `).join('');

    setupObservers(allPrompts);
}

function setupObservers(allPrompts) {
    const answered = getAnswered();
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.dataset.promptId;
                if (!answered[id]) {
                    const prompt = allPrompts.find(p => p.id === id);
                    if (prompt) openModal(prompt);
                }
            }
        });
    }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });

    document.querySelectorAll('.trigger-line').forEach(el => observer.observe(el));
}

function openModal(prompt) {
    currentPromptId = prompt.id;
    selectedChoice = null;

    const modal = document.getElementById('modal');
    modal.classList.toggle('wide', prompt.type === 'text');

    document.getElementById('modalQuestion').textContent = prompt.question;
    const choicesEl = document.getElementById('modalChoices');

    if (prompt.type === 'text') {
        choicesEl.innerHTML = `<textarea class="modal-input" id="textInput" placeholder="Type your answer..."></textarea>`;
    } else {
        choicesEl.innerHTML = prompt.choices.map((c, i) => `
            <div class="modal-choice" onclick="selectChoice(${i})">
                <input type="radio" name="choice" id="choice${i}" value="${i}">
                <label for="choice${i}">${c}</label>
            </div>
        `).join('');
    }

    document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    currentPromptId = null;
    selectedChoice = null;
}

function selectChoice(index) {
    selectedChoice = index;
    document.querySelectorAll('.modal-choice input').forEach((el, i) => el.checked = i === index);
}

function submit() {
    if (!currentPromptId) return;
    const textInput = document.getElementById('textInput');
    if (textInput && !textInput.value.trim()) return;
    if (!textInput && selectedChoice === null) return;

    setAnswered(currentPromptId);
    closeModal();
    renderPrompts();
}

function resetAll() {
    if (confirm('Reset all prompts?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
}

// Event listeners
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('btnSkip').addEventListener('click', closeModal);
document.getElementById('btnSubmit').addEventListener('click', submit);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

// Initialize
renderPrompts();
</script>

</body>
</html>
