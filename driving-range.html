<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Range - Prompt Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 15px; background: #f5f5f5; font-size: 14px; line-height: 1.5; }
        h1 { text-align: center; margin-bottom: 15px; font-size: 18px; }

        /* Stats Bar */
        .stats-bar { display: flex; gap: 15px; justify-content: center; padding: 10px; background: #fff; border: 1px solid #ddd; margin-bottom: 15px; font-size: 12px; flex-wrap: wrap; }
        .stat { color: #666; }

        /* Bulk Actions */
        .bulk-actions { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
        .bulk-btn { padding: 6px 12px; font-size: 11px; cursor: pointer; border: 1px solid #999; background: #fff; }
        .bulk-btn.danger { background: #ff0000; color: #fff; border: none; }

        /* Search/Filter */
        .filter-bar { display: flex; gap: 10px; padding: 10px; background: #fff; border: 1px solid #ddd; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { padding: 6px; font-size: 12px; border: 1px solid #ccc; }
        .filter-bar input { flex: 1; min-width: 150px; }
        .filter-bar select { min-width: 120px; }

        /* Add Form */
        .add-form { background: #fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; }
        .add-form h2 { font-size: 14px; margin-bottom: 12px; cursor: pointer; }
        .add-form.collapsed .form-body { display: none; }
        .form-row { margin-bottom: 10px; }
        .form-row label { display: block; font-size: 11px; color: #666; margin-bottom: 3px; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 6px; font-size: 13px; border: 1px solid #ccc; font-family: inherit; }
        .form-row textarea { min-height: 50px; resize: vertical; }
        .form-row-inline { display: flex; gap: 10px; }
        .form-row-inline > div { flex: 1; }
        .choices-list { margin: 5px 0; }
        .choice-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
        .choice-row input { flex: 1; }
        .choice-row button { padding: 4px 8px; font-size: 11px; cursor: pointer; background: #eee; border: 1px solid #ccc; }
        .add-choice-btn { padding: 4px 10px; font-size: 11px; cursor: pointer; background: #fff; border: 1px solid #ccc; margin-top: 5px; }
        .add-choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .emoji-grid { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0; }
        .emoji-btn { width: 32px; height: 32px; font-size: 18px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
        .emoji-btn.selected { background: #000; border-color: #000; }
        .scale-labels { display: flex; gap: 10px; }
        .scale-labels > div { flex: 1; }
        .form-submit { padding: 8px 20px; font-size: 13px; cursor: pointer; background: #000; color: #fff; border: none; margin-top: 10px; }

        /* Chapter Groups */
        .chapter-group { margin-bottom: 20px; }
        .chapter-header { background: #333; color: #fff; padding: 8px 12px; font-size: 12px; }

        /* Prompt Cards */
        .prompt-card { background: #fff; border: 1px solid #ddd; padding: 12px; margin-top: -1px; }
        .prompt-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .prompt-card-id { font-size: 11px; color: #666; }
        .prompt-card-status { font-size: 11px; }
        .prompt-card-status.tested { color: #000; }
        .prompt-card-type { display: inline-block; font-size: 10px; background: #eee; padding: 2px 6px; margin-bottom: 8px; }
        .prompt-card-question { font-size: 13px; margin-bottom: 8px; }
        .prompt-card-details { font-size: 11px; color: #666; margin-bottom: 8px; }
        .prompt-card-actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .prompt-card-actions button { padding: 4px 8px; font-size: 10px; cursor: pointer; background: #fff; border: 1px solid #ccc; }
        .prompt-card-actions button:hover { background: #eee; }
        .prompt-card-actions button.danger { color: #ff0000; border-color: #ff0000; }
        .trigger-line { height: 2px; background: #ff0000; margin: 10px 0; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        .modal { background: #fff; width: 90%; padding: 20px; position: relative; }
        .modal.small { max-width: 260px; }
        .modal.medium { max-width: 400px; }
        .modal-close { position: absolute; top: 5px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer; }
        .modal-question { font-size: 14px; font-weight: normal; margin-bottom: 15px; }
        .modal-choices { margin-bottom: 15px; }
        .modal-choice { display: block; padding: 5px 0; cursor: pointer; font-size: 13px; }
        .modal-choice input { margin-right: 8px; }
        .modal-input { width: 100%; padding: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 13px; margin-bottom: 10px; resize: vertical; min-height: 60px; }
        .modal-scale { margin: 15px 0; }
        .modal-scale-labels { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-bottom: 5px; }
        .modal-scale input[type="range"] { width: 100%; }
        .modal-scale-value { text-align: center; font-size: 24px; margin: 10px 0; }
        .modal-emojis { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
        .modal-emoji { font-size: 28px; cursor: pointer; padding: 5px; border: 2px solid transparent; border-radius: 8px; }
        .modal-emoji:hover, .modal-emoji.selected { border-color: #000; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 8px; cursor: pointer; font-size: 13px; font-weight: normal; }
        .modal-btn.submit { background: #000; color: #fff; border: none; }
        .modal-btn.skip { background: #fff; color: #000; border: 1px solid #999; }
        .modal-outcome { margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd; font-size: 13px; font-style: italic; }

        /* Edit Modal */
        .edit-modal { max-width: 500px; max-height: 80vh; overflow-y: auto; }

        .end-section { text-align: center; padding: 30px; color: #888; font-size: 12px; }

        /* View Toggle */
        .view-toggle { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .view-btn { padding: 6px 15px; font-size: 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
        .view-btn.active { background: #333; color: #fff; border-color: #333; }

        /* Preview button */
        .prompt-card-actions button.preview { background: #e8f4e8; border-color: #4a4; color: #262; }

        /* Preview Mode */
        .preview-badge { background: #4a4; color: #fff; font-size: 10px; padding: 3px 8px; margin-bottom: 10px; display: inline-block; }
        .preview-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .preview-toggle button { padding: 4px 10px; font-size: 11px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
        .preview-toggle button.active { background: #333; color: #fff; }
        .modal.mobile-preview { max-width: 340px !important; width: 95% !important; }

        /* Chapter Map */
        .chapter-map { background: #fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; }
        .chapter-map h2 { text-align: center; font-size: 14px; margin-bottom: 15px; }
        .chapter-map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .chapter-cell { padding: 8px; font-size: 11px; border: 1px solid #eee; cursor: pointer; }
        .chapter-cell.has-prompts { background: #f8f8f8; }
        .chapter-cell.has-prompts:hover { background: #e8e8e8; }
        .chapter-cell.empty { color: #aaa; cursor: default; }
        .chapter-cell .dots { color: #666; }
        .chapter-cell .dots .tested { color: #4a4; }
        .chapter-map-summary { margin-top: 15px; text-align: center; font-size: 12px; color: #666; }

        @media (max-width: 600px) {
            .filter-bar { flex-direction: column; }
            .form-row-inline { flex-direction: column; gap: 10px; }
            .chapter-map-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<h1>PROMPT DRIVING RANGE</h1>

<!-- Stats Bar -->
<div class="stats-bar">
    <span class="stat" id="statTotal">0 Total</span>
    <span class="stat" id="statTested">0 Tested</span>
    <span class="stat" id="statUntested">0 Untested</span>
    <span class="stat" id="statChapters">0 Chapters</span>
</div>

<!-- View Toggle -->
<div class="view-toggle">
    <button class="view-btn active" id="listViewBtn" onclick="setView('list')">List View</button>
    <button class="view-btn" id="mapViewBtn" onclick="setView('map')">Chapter Map</button>
</div>

<!-- Bulk Actions -->
<div class="bulk-actions">
    <button class="bulk-btn" onclick="exportAll()">EXPORT ALL</button>
    <button class="bulk-btn" onclick="importPrompts()">IMPORT</button>
    <button class="bulk-btn danger" onclick="resetAll()">RESET ALL</button>
</div>

<!-- Filter Bar -->
<div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search prompts..." oninput="debounceRender()">
    <select id="chapterFilter" onchange="renderPrompts()">
        <option value="">All Chapters</option>
    </select>
    <select id="typeFilter" onchange="renderPrompts()">
        <option value="">All Types</option>
        <option value="multiple-choice">Multiple Choice</option>
        <option value="text-input">Text Input</option>
        <option value="checkboxes">Checkboxes</option>
        <option value="poll">Poll</option>
        <option value="scale">Scale</option>
        <option value="yes-no">Yes/No</option>
        <option value="prediction">Prediction</option>
        <option value="emoji-reaction">Emoji Reaction</option>
    </select>
</div>

<!-- Add Form -->
<div class="add-form collapsed" id="addForm">
    <h2 onclick="toggleForm()">+ ADD NEW PROMPT</h2>
    <div class="form-body">
        <div class="form-row-inline">
            <div class="form-row">
                <label>Question</label>
                <input type="text" id="formQuestion" placeholder="What would you do?">
            </div>
            <div class="form-row" style="max-width: 120px;">
                <label>Chapter</label>
                <input type="number" id="formChapter" placeholder="15" min="1" max="30">
            </div>
        </div>
        <div class="form-row">
            <label>Type</label>
            <select id="formType" onchange="updateFormFields()">
                <option value="multiple-choice">Multiple Choice (max 4)</option>
                <option value="text-input">Text Input (280 chars)</option>
                <option value="checkboxes">Checkboxes (max 6)</option>
                <option value="poll">Poll (max 4)</option>
                <option value="scale">Scale (1-10)</option>
                <option value="yes-no">Yes/No</option>
                <option value="prediction">Prediction (max 4)</option>
                <option value="emoji-reaction">Emoji Reaction (max 8)</option>
            </select>
        </div>
        <div class="form-row">
            <label>Trigger Text (exact text from manuscript)</label>
            <textarea id="formTrigger" placeholder="shape or form.\n&quot;Ok.&quot;"></textarea>
        </div>
        <div class="form-row">
            <label>Context (optional setup)</label>
            <input type="text" id="formContext" placeholder="Verlander blew you off...">
        </div>

        <!-- Dynamic Fields -->
        <div id="dynamicFields"></div>

        <div class="form-row">
            <label>Outcome (what actually happened)</label>
            <textarea id="formOutcome" placeholder="I asked it on-camera..."></textarea>
        </div>
        <button class="form-submit" onclick="addPrompt()">ADD PROMPT</button>
    </div>
</div>

<!-- Chapter Map (hidden by default) -->
<div class="chapter-map" id="chapterMap" style="display:none;">
    <h2>CHAPTER MAP</h2>
    <div class="chapter-map-grid" id="chapterMapGrid"></div>
    <div class="chapter-map-summary" id="chapterMapSummary"></div>
</div>

<!-- Prompts Container -->
<div id="promptsContainer"></div>

<div class="end-section">END OF PROMPTS</div>

<!-- Test Modal -->
<div class="modal-overlay" id="testModal">
    <div class="modal" id="testModalContent">
        <button class="modal-close" onclick="closeTestModal()">&times;</button>
        <div class="modal-question" id="testQuestion"></div>
        <div class="modal-choices" id="testChoices"></div>
        <div class="modal-buttons" id="testButtons">
            <button class="modal-btn skip" onclick="skipTest()">SKIP</button>
            <button class="modal-btn submit" onclick="submitTest()">SUBMIT</button>
        </div>
        <div class="modal-outcome" id="testOutcome" style="display:none;"></div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal edit-modal" id="editModalContent">
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
        <h3 style="margin-bottom:15px;font-size:14px;">EDIT PROMPT</h3>
        <div id="editFormContent"></div>
        <div style="display:flex;gap:10px;margin-top:15px;">
            <button class="modal-btn skip" onclick="closeEditModal()">CANCEL</button>
            <button class="modal-btn submit" onclick="saveEdit()">SAVE</button>
        </div>
    </div>
</div>

<!-- Hidden file input for import -->
<input type="file" id="importFile" style="display:none" accept=".json" onchange="handleImport(event)">

<script src="./js/driving-range.js"></script>

</body>
</html>
