<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONEY MODE - Premium Content</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/typography.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">

    <style>
        body {
            padding: 90px 20px 40px;
        }

        /* Sticky header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid var(--color-border);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 69px;
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-logo-img {
            height: 28px;
            width: auto;
        }

        .back-to-reader {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-primary);
            transition: opacity 0.15s ease;
        }

        .back-to-reader:hover {
            opacity: 0.7;
        }

        .book {
            max-width: 680px;
            margin: 0 auto;
        }

        .chapter-section {
            margin-bottom: 40px;
        }

        .chapter-section .chapter-header {
            margin-top: 2em;
            margin-bottom: 2em;
            padding-bottom: 1.5em;
            border-bottom: 1px solid var(--color-border);
        }

        .chapter-section .chapter-body {
            margin: 0;
        }

        .scene-break {
            text-align: center;
            margin: 0;
            padding: var(--space-lg) 0;
        }

        .flashback-header {
            font-size: 1.25rem;
            letter-spacing: 3px;
            margin: 0;
            padding: var(--space-lg) 0;
        }

        .media-modal-icon {
            display: none;
        }

        .media-emoji {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "EmojiOne Color", "Android Emoji", emoji, sans-serif !important;
        }

        .chapter-end {
            text-align: center !important;
            display: block;
            width: 100%;
            padding: 1.5em 0 3em 0;
            color: var(--color-text-tertiary);
            letter-spacing: 0.5em;
            font-size: 1.25rem;
        }

        /* Navigation footer */
        .nav-footer {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background-color: var(--color-background);
            padding: var(--space-sm) var(--space-md);
            display: flex;
            justify-content: center;
            gap: var(--space-2xl);
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            color: var(--color-text);
            font-family: inherit;
            font-size: 14px;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ====== MONEY MODE: LOCKED STATE ====== */

        /* Status indicator */
        .status-badge {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .status-badge.locked {
            background: #333;
            color: #fff;
        }

        .status-badge.unlocked {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        /* Full page lock overlay */
        .page-lock-overlay {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: 90;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            transition: opacity 0.4s ease;
        }

        .page-lock-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .lock-icon-large {
            font-size: 72px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }


        /* Blurred content when locked */
        body.locked .book {
            filter: blur(10px);
            pointer-events: none;
            user-select: none;
        }

        body.locked .nav-footer {
            display: none;
        }

        /* Unlocked state */
        body.unlocked .page-lock-overlay {
            opacity: 0;
            pointer-events: none;
        }

        body.unlocked .book {
            filter: none;
            pointer-events: auto;
            user-select: text;
        }
    </style>
</head>
<body class="locked">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="./" class="back-to-reader" aria-label="Back to reader">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </a>
            <a href="./" class="header-logo"><img src="./assets/icons/OTR-header.png" alt="OFF-THE-RECORD" class="header-logo-img"></a>
            <span class="status-badge locked" id="statusBadge">Locked</span>
        </div>
    </header>

    <!-- Lock Overlay -->
    <div class="page-lock-overlay" id="lockOverlay">
        <div class="lock-icon-large">🔒</div>
    </div>

    <!-- Main Content -->
    <main class="book">
        <div id="content"></div>
    </main>

    <!-- Navigation Footer -->
    <nav class="nav-footer" id="navFooter">
        <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous chapter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Previous</span>
        </button>
        <button class="nav-btn nav-next" id="nextBtn" aria-label="Next chapter">
            <span>Next</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </nav>

    <script type="module">
        import { CHAPTERS } from './data/chapters.js';
        import { mediaModal } from './js/mediaModal.js';

        // ====== MONEY MODE: SIMPLE LOCK/UNLOCK ======

        const isUnlocked = localStorage.getItem('moneyMode_unlocked') === 'true';
        const statusBadge = document.getElementById('statusBadge');

        function setUnlocked(unlocked) {
            localStorage.setItem('moneyMode_unlocked', unlocked);
            if (unlocked) {
                document.body.classList.remove('locked');
                document.body.classList.add('unlocked');
                statusBadge.textContent = 'Unlocked';
                statusBadge.classList.remove('locked');
                statusBadge.classList.add('unlocked');
            } else {
                document.body.classList.remove('unlocked');
                document.body.classList.add('locked');
                statusBadge.textContent = 'Locked';
                statusBadge.classList.remove('unlocked');
                statusBadge.classList.add('locked');
            }
        }

        // Initialize state
        setUnlocked(isUnlocked);

        // Status badge click to toggle
        statusBadge.addEventListener('click', () => {
            const currentlyUnlocked = document.body.classList.contains('unlocked');
            setUnlocked(!currentlyUnlocked);
        });

        // Keyboard shortcut: Ctrl+U to toggle
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                const currentlyUnlocked = document.body.classList.contains('unlocked');
                setUnlocked(!currentlyUnlocked);
            }
        });

        // ====== RENDER CHAPTERS ======

        const container = document.getElementById('content');
        container.innerHTML = CHAPTERS.map((ch, i) => {
            const isSpecial = ch.section === 'title' || ch.section === 'toc';
            return `
            <article class="chapter-section${isSpecial ? ' special-page' : ''}" id="chapter-${ch.id}" data-chapter="${i}">
                ${!isSpecial ? `<header class="chapter-header"><h2 class="chapter-title">${ch.title}</h2></header>` : ''}
                <div class="chapter-body">${ch.content}</div>
                ${!isSpecial ? '<div class="chapter-end">***</div>' : ''}
            </article>
        `}).join('');

        // Hash navigation
        if (window.location.hash) {
            const target = document.querySelector(window.location.hash);
            if (target) setTimeout(() => target.scrollIntoView(), 100);
        }

        // Chapter navigation
        const chapters = document.querySelectorAll('.chapter-section');
        const totalChapters = chapters.length;
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentChapter = 0;

        function updateNav() {
            prevBtn.disabled = currentChapter === 0;
            nextBtn.disabled = currentChapter === totalChapters - 1;
        }

        function scrollToChapter(index) {
            if (index >= 0 && index < totalChapters) {
                currentChapter = index;
                chapters[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
                updateNav();
            }
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    currentChapter = parseInt(entry.target.dataset.chapter);
                    updateNav();
                }
            });
        }, { rootMargin: '-80px 0px -50% 0px', threshold: 0 });

        chapters.forEach(ch => observer.observe(ch));

        prevBtn.addEventListener('click', () => scrollToChapter(currentChapter - 1));
        nextBtn.addEventListener('click', () => scrollToChapter(currentChapter + 1));

        updateNav();

        // Media modal
        mediaModal.init();
        document.querySelectorAll('.media-emoji').forEach(emoji => {
            emoji.addEventListener('click', (e) => {
                e.preventDefault();
                const mediaId = emoji.getAttribute('data-media-id');
                if (mediaId) mediaModal.open(mediaId);
            });
        });
    </script>

    <script async src="https://platform.twitter.com/widgets.js"></script>
</body>
</html>
