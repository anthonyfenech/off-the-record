<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="About OFF-THE-RECORD">
    <meta name="theme-color" content="#333333">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>About - OFF-THE-RECORD</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">

    
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="./fonts/literata-regular.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Self-hosted fonts (no external request) -->
    <link rel="stylesheet" href="./css/fonts.min.css">

    <link rel="stylesheet" href="./css/reset.min.css">
    <link rel="stylesheet" href="./css/variables.min.css">
    <link rel="stylesheet" href="./css/typography.min.css">
    <link rel="stylesheet" href="./css/layout.min.css">
    <link rel="stylesheet" href="./css/components.min.css">
    <style>
        .page-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 20px 40px;
        }
        .page-header {
            margin-bottom: 32px;
        }
        .page-title {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .page-content {
            line-height: 1.8;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
            color: var(--color-text-primary);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="./" class="header-logo"><img src="./assets/icons/OTR-header.png" alt="OFF-THE-RECORD" class="header-logo-img"></a>
        </div>
    </header>

    <main class="page-container">
        <header class="page-header">
            <h1 class="page-title">About</h1>
        </header>

        <div class="page-content">
            <p>Content coming soon.</p>
        </div>

        <a href="./" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back to book
        </a>
    </main>
</body>
</html>
