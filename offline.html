<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#333333">

    <title>OFF-THE-RECORD</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">
    <link rel="stylesheet" href="./css/variables.min.css?v=423">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Literata', Georgia, serif;
            background: var(--color-background);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .offline-icon {
            font-size: 48px;
            margin-bottom: 24px;
            opacity: 0.6;
        }
        h1 {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 400px;
            margin-bottom: 24px;
            color: var(--color-text-secondary);
        }
        .retry-btn {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 24px;
            border: 1px solid var(--color-text-primary);
            background: transparent;
            color: var(--color-text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .retry-btn:hover {
            background: var(--color-text-primary);
            color: var(--color-background);
        }
        .home-link {
            margin-top: 16px;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 12px;
            color: var(--color-text-secondary);
            text-decoration: none;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Inherit theme from localStorage
        (function() {
            var theme = localStorage.getItem('reader_theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div class="offline-icon">&#128246;</div>
    <h1>You're Offline</h1>
    <p>This chapter isn't available offline. Connect to the internet to continue reading.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    <a href="./" class="home-link">Back to Home</a>
</body>
</html>
