    <!-- FAILSAFE: URL kill switch — add ?reset=true to URL to nuke all overlays -->
    <script>
    (function(){
        if(window.location.search.indexOf('reset=true')===-1)return;
        var s=document.createElement('style');
        s.textContent='*{pointer-events:auto!important}.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]{display:none!important;pointer-events:none!important;visibility:hidden!important;opacity:0!important;z-index:-1!important}body{overflow:auto!important;pointer-events:auto!important}';
        document.head.appendChild(s);
        document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.active').forEach(function(el){el.classList.remove('active')});
            document.querySelectorAll('.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]').forEach(function(el){
                el.style.cssText='display:none!important;pointer-events:none!important;visibility:hidden!important;opacity:0!important;z-index:-1!important';
            });
            document.body.style.overflow='auto';
            document.body.style.pointerEvents='auto';
            document.body.classList.remove('sidebar-open','modal-open','no-scroll','home-page');
            console.log('NUCLEAR RESET TRIGGERED — all overlays destroyed. Remove ?reset=true from URL to restore normal behavior.');
        });
    })();
    </script>

    <!-- Emergency overlay cleanup - runs before anything else -->
    <script>
        (function() {
            // Immediately clear any stuck overlay states from previous sessions
            document.addEventListener('DOMContentLoaded', function() {
                // Remove active class from all overlays including lightbox
                var overlays = document.querySelectorAll('.overlay, .lightbox-overlay, .media-modal-overlay, .photo-modal-overlay, [class*="overlay"], [id*="overlay"]');

                    el.classList.remove('active');
                    el.style.pointerEvents = 'none';
                    el.style.display = 'none';
                    el.style.visibility = 'hidden';
                });
                // Ensure body scroll is not locked
                document.body.style.overflow = '';
            });
        })();

            document.body.style.opacity = '1';

    <!-- Sidebar Navigation (builds TOC identical to navigation.js) -->
    <script type="module">
        import { CHAPTERS, getChaptersByYear, getIntroChapters, getPostscriptChapters, getSortedYears } from './data/chapters.js';
        import { isChapterComplete } from './js/storage.min.js';

        const menuBtn = document.getElementById('menuBtn');
        const closeTocBtn = document.getElementById('closeTocBtn');
        const tocSidebar = document.getElementById('tocSidebar');
        const overlay = document.getElementById('overlay');
        const tocContent = document.getElementById('tocContent');

        // Build TOC
        buildTOC();

        const expandedSections = new Set();

        function openTOC() {
            // Always collapse chapters before opening
            expandedSections.delete('book');
            const bookContent = document.getElementById('toc-book-content');
            const bookSection = tocContent.querySelector('[data-section="book"]');
            if (bookContent) bookContent.classList.add('collapsed');
            if (bookSection) bookSection.querySelector('.toc-top-header')?.classList.remove('expanded');

            tocSidebar.style.visibility = 'visible';
            tocSidebar.style.transform = '';
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '';
            tocSidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeTOC() {
            tocSidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (!tocSidebar.classList.contains('open')) {
                    tocSidebar.style.visibility = 'hidden';
                    overlay.style.visibility = 'hidden';
                    // Collapse book section while sidebar is hidden (no visible animation)
                    expandedSections.delete('book');
                    const bookContent = document.getElementById('toc-book-content');
                    const bookSection = tocContent.querySelector('[data-section="book"]');
                    if (bookContent) bookContent.classList.add('collapsed');
                    if (bookSection) bookSection.querySelector('.toc-top-header')?.classList.remove('expanded');
                }
            }, 310);
        }

        menuBtn.addEventListener('click', openTOC);
        closeTocBtn.addEventListener('click', closeTOC);
        overlay.addEventListener('click', closeTOC);

        // Touch support for iOS - use touchend with scroll detection
        let closeBtnTouchMoved = false;
        closeTocBtn.addEventListener('touchstart', () => { closeBtnTouchMoved = false; }, { passive: true });
        closeTocBtn.addEventListener('touchmove', () => { closeBtnTouchMoved = true; }, { passive: true });
        closeTocBtn.addEventListener('touchend', (e) => {
            if (!closeBtnTouchMoved) {
                e.preventDefault();
                closeTOC();
            }
        });

        let overlayTouchMoved = false;
        overlay.addEventListener('touchstart', () => { overlayTouchMoved = false; }, { passive: true });
        overlay.addEventListener('touchmove', () => { overlayTouchMoved = true; }, { passive: true });
        overlay.addEventListener('touchend', (e) => {
            if (!overlayTouchMoved) {
                e.preventDefault();
                closeTOC();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && tocSidebar.classList.contains('open')) {
                closeTOC();
            }
        });

        function buildTOC() {
            const fragment = document.createDocumentFragment();

            // BOOK section
            fragment.appendChild(createBookSection());

            // BINGE MODE link
            fragment.appendChild(createTopSection({ id: 'binge-mode', label: 'BINGE MODE', type: 'link', url: './binge-mode.html', current: false }));

            // DOWNLOAD link
            fragment.appendChild(createTopSection({ id: 'download', label: 'DOWNLOAD', type: 'link', url: './downloadpage.html', current: false }));

            // CREDENTIALS link (current page - highlighted)
            fragment.appendChild(createTopSection({ id: 'credentials', label: 'CREDENTIALS', type: 'link', url: './credentials.html', current: true }));

            // GUESTBOOK link
            fragment.appendChild(createTopSection({ id: 'guestbook', label: 'GUESTBOOK', type: 'link', url: './guestbook.html', current: false }));

            // Divider
            const divider = document.createElement('div');
            divider.className = 'toc-divider';
            fragment.appendChild(divider);

            tocContent.appendChild(fragment);
        }

        function createBookSection() {
            const section = document.createElement('div');
            section.className = 'toc-top-section';
            section.dataset.section = 'book';

            const sectionHeader = document.createElement('div');
            sectionHeader.className = 'toc-top-header';

            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'toc-top-title';
            sectionTitle.textContent = 'OFF-THE-RECORD';

            sectionHeader.appendChild(sectionTitle);

            const bookContent = document.createElement('div');
            bookContent.className = 'toc-book-content collapsed';
            bookContent.id = 'toc-book-content';

            buildBookContent(bookContent);

            sectionHeader.addEventListener('click', () => {
                toggleTopSection('book', sectionHeader, bookContent);
            });

            section.appendChild(sectionHeader);
            section.appendChild(bookContent);

            return section;
        }

        function buildBookContent(container) {
            const frontMatter = CHAPTERS.filter(c => c.section === 'title' || c.section === 'toc');
            const introChapters = getIntroChapters();
            const chaptersByYear = getChaptersByYear();
            const years = getSortedYears();
            const postscriptChapters = getPostscriptChapters();

            frontMatter.forEach(chapter => {
                container.appendChild(createChapterItem(chapter));
            });

            introChapters.forEach(chapter => {
                container.appendChild(createChapterItem(chapter));
            });

            years.forEach(year => {
                const chapters = chaptersByYear[year] || [];
                chapters.forEach(chapter => {
                    container.appendChild(createChapterItem(chapter));
                });
            });

            postscriptChapters.forEach(chapter => {
                container.appendChild(createChapterItem(chapter));
            });
        }

        function createChapterItem(chapter) {
            const item = document.createElement('div');
            item.className = 'toc-chapter';
            item.dataset.chapterId = chapter.id;

            const lockedChapters = JSON.parse(localStorage.getItem('admin_lockedChapters') || '[]');
            const isLocked = lockedChapters.includes(chapter.id);

            if (isLocked) {
                item.classList.add('toc-chapter-locked');
            }

            const indicator = document.createElement('div');
            indicator.className = 'chapter-indicator';

            const info = document.createElement('div');
            info.className = 'toc-chapter-info';

            const titleRow = document.createElement('div');
            titleRow.className = 'toc-chapter-title-row';

            const title = document.createElement('span');
            title.className = 'toc-chapter-title';
            title.textContent = chapter.title;

            titleRow.appendChild(title);

            if (isLocked) {
                const lockIcon = document.createElement('span');
                lockIcon.className = 'toc-lock-icon';
                lockIcon.textContent = '🔒';
                titleRow.appendChild(lockIcon);
            }

            info.appendChild(titleRow);

            item.appendChild(indicator);
            item.appendChild(info);

            const handleChapterSelect = () => {
                if (!isLocked) {
                    closeTOC();
                    window.location.href = './#chapter-' + chapter.id;
                }
            };
            item.addEventListener('click', handleChapterSelect);

            if (isChapterComplete(chapter.id)) {
                item.classList.add('completed');
                indicator.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            }

            return item;
        }

        function createTopSection(section) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'toc-top-section';
            sectionDiv.dataset.section = section.id;

            // Use proper <a> tag for right-click, middle-click support
            const link = document.createElement('a');
            link.className = 'toc-top-header toc-top-link';
            link.href = section.url;

            const title = document.createElement('h3');
            title.className = 'toc-top-title';
            title.textContent = section.label;
            link.appendChild(title);

            if (section.current) {
                link.style.background = 'var(--color-bg-hover)';
                link.style.cursor = 'default';
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                });
            } else {
                link.addEventListener('click', () => {
                    closeTOC();
                });
            }

            sectionDiv.appendChild(link);
            return sectionDiv;
        }

        function toggleTopSection(sectionId, sectionHeader, sectionContent) {
            if (expandedSections.has(sectionId)) {
                expandedSections.delete(sectionId);
                sectionContent.classList.add('collapsed');
                sectionHeader.classList.remove('expanded');
            } else {
                expandedSections.add(sectionId);
                sectionContent.classList.remove('collapsed');
                sectionHeader.classList.add('expanded');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('otr_beta_session');
            window.location.href = './';
        });

        // Options toggle
        const optionsToggle = document.getElementById('optionsToggle');
        const optionsContent = document.getElementById('optionsContent');
        if (optionsToggle && optionsContent) {
            optionsToggle.addEventListener('click', () => {
                const isExpanded = optionsToggle.getAttribute('aria-expanded') === 'true';
                optionsToggle.setAttribute('aria-expanded', !isExpanded);
                optionsContent.style.display = isExpanded ? 'none' : 'block';
            });
        }

        // Theme toggle in options
        const themeToggleGroup = document.getElementById('themeToggleGroup');
        if (themeToggleGroup) {
            const buttons = themeToggleGroup.querySelectorAll('.option-btn');
            const updateThemeButtons = () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                buttons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === (isDark ? 'dark' : 'light'));
                });
            };
            updateThemeButtons();
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.theme === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('reader_theme', 'dark');
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                        localStorage.setItem('reader_theme', 'light');
                    }
                    updateThemeButtons();
                });
            });
        }

        // Search toggle (placeholder - search not functional on this page)
        const searchToggle = document.getElementById('searchToggle');
        const searchContent = document.getElementById('searchContent');
        if (searchToggle && searchContent) {
            searchToggle.addEventListener('click', () => {
                const isExpanded = searchToggle.getAttribute('aria-expanded') === 'true';
                searchToggle.setAttribute('aria-expanded', !isExpanded);
                searchContent.style.display = isExpanded ? 'none' : 'block';
            });
        }
    </script>

        const basePath = './assets/credentials/';
        const image = document.getElementById('credentialImage');
        const placeholder = document.getElementById('credentialPlaceholder');
        const button = document.getElementById('spinButton');

        let isSpinning = false;
        let spinInterval = null;

        button.addEventListener('click', handleClick);

        function handleClick() {
            if (isSpinning) {
                stopSpin();
            } else {
                startSpin();
            }
        }

        function startSpin() {
            if (CREDENTIALS.length === 0) {
                console.error('No credentials loaded');
                return;
            }

            isSpinning = true;
            button.textContent = 'STOP';
            placeholder.style.display = 'none';
            image.style.display = 'block';

            // Rapid cycling
            spinInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * CREDENTIALS.length);
                image.src = basePath + CREDENTIALS[randomIndex];
            }, 30); // Fast spin
        }

        function stopSpin() {
            isSpinning = false;
            button.textContent = 'SPIN';
            clearInterval(spinInterval);
            const finalIndex = Math.floor(Math.random() * CREDENTIALS.length);
            image.src = basePath + CREDENTIALS[finalIndex];
        }
    })();
