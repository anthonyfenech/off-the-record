    <!-- FAILSAFE: URL kill switch — add ?reset=true to URL to nuke all overlays -->
    <script>
    (function(){
        if(window.location.search.indexOf('reset=true')===-1)return;
        var s=document.createElement('style');
        s.textContent='*{pointer-events:auto!important}.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]{display:none!important;pointer-events:none!important;visibility:hidden!important;opacity:0!important;z-index:-1!important}body{overflow:auto!important;pointer-events:auto!important}';
        document.head.appendChild(s);
        document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.active').forEach(function(el){el.classList.remove('active')});
            document.querySelectorAll('.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]').forEach(function(el){
                el.style.cssText='display:none!important;pointer-events:none!important;visibility:hidden!important;opacity:0!important;z-index:-1!important';
            });
            document.body.style.overflow='auto';
            document.body.style.pointerEvents='auto';
            document.body.classList.remove('sidebar-open','modal-open','no-scroll','home-page');
            console.log('NUCLEAR RESET TRIGGERED — all overlays destroyed. Remove ?reset=true from URL to restore normal behavior.');
        });
    })();
    </script>

    <!-- CRITICAL: Apply theme BEFORE CSS loads to prevent FOUC -->
    <script>
        (function() {
            if (localStorage.getItem('reader_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Critical: Hide sidebar and overlays before CSS loads to prevent flash -->
    <style>.toc-sidebar{visibility:hidden;transform:translateX(-100%)}.overlay,.lightbox-overlay{visibility:hidden;opacity:0;pointer-events:none}</style>

    <!-- Emergency overlay cleanup - runs before anything else -->
    <script>
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                var overlays = document.querySelectorAll('.overlay, .lightbox-overlay, .prompt-overlay, [class*="overlay"], [id*="overlay"]');
                overlays.forEach(function(el) {
                    el.classList.remove('active');
                    el.style.pointerEvents = 'none';
                    el.style.visibility = 'hidden';
                });
                document.body.style.overflow = '';
            });
        })();
    </script>

    <style>
        body {
            padding: 90px 20px 40px;
        }

        /* === PARAGRAPH FORMATTING === */
        .chapter-body p {
            text-indent: 0.5in !important;
            text-align: justify !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.6;
        }

        .chapter-body p:empty {
            height: 1em;
            margin: 0 !important;
            padding: 0 !important;
        }

        .chapter-body p:first-child {
            text-indent: 0 !important;
        }

        .chapter-body .dateline {
            font-weight: 500;
        }

        .chapter-body p.headline-block {
            text-indent: 0 !important;
        }

        .chapter-body .block-quote p {
            text-indent: 0 !important;
            margin-left: 2em !important;
        }

        /* Mobile: smaller indent, left-aligned for readability */
        @media (max-width: 600px) {
            .chapter-body p {
                text-indent: 24px !important;
                text-align: left !important;
            }
        }

        /* Sticky header - GPU accelerated */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--color-header-bg);
            border-bottom: 1px solid var(--color-border);
            will-change: transform;
            backface-visibility: hidden;
            transition: background-color var(--transition-fast);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 69px;
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-logo-img {
            height: 28px;
            width: auto;
        }

        .book {
            max-width: 680px;
            margin: 0 auto;
        }

        .chapter-section {
            margin-bottom: 40px;
            contain: layout style paint;
        }

        .chapter-section .chapter-header {
            margin-top: 2em;
            margin-bottom: 2em;
            padding-bottom: 1.5em;
            border-bottom: 1px solid var(--color-border);
        }

        .chapter-section .chapter-body {
            margin: 0;
        }

        /* Remove block quote styling for full book */
        .block-quote {
            margin: 0;
            padding: 0;
            border-left: none;
            background-color: transparent;
        }

        /* Hide emoji icon in modal header */
        .media-modal-icon {
            display: none;
        }

        /* Fix emoji display - must reset font smoothing for mobile */
        .media-emoji {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "EmojiOne Color", "Android Emoji", emoji, sans-serif !important;
            text-rendering: auto !important;
            -webkit-font-smoothing: auto !important;
            -moz-osx-font-smoothing: auto !important;
        }

        /* Smaller images in modal - desktop */
        .media-image {
            max-height: 450px;
            width: auto;
        }

        /* Smaller images on mobile */
        @media (max-width: 600px) {
            .media-image {
                max-height: 280px;
            }
        }

        /* Chapter end separator - plain centered *** */
        .chapter-section > .scene-break {
            text-align: center !important;
            text-indent: 0 !important;
            margin: 2em 0 0 0;
            padding: 0;
            color: inherit;
            letter-spacing: normal;
            font-size: inherit;
        }

        /* Remove extra margin from chapter headers after scene-break */
        .chapter-section + .chapter-section .chapter-header {
            margin-top: 0;
        }

        /* Navigation footer — floating compact box */
        .nav-footer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: #ffffff;
            border: 1.5px solid #1a1a1a;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: auto;
            max-width: 260px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            gap: 0;
            will-change: transform;
            backface-visibility: hidden;
        }

        /* All nav buttons — base style */
        .nav-btn {
            font-family: 'Courier New', 'Courier Prime', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #1a1a1a;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0;
            white-space: nowrap;
            transition: opacity 0.15s ease;
        }

        .nav-btn:hover:not(:disabled) {
            opacity: 0.6;
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .nav-btn svg {
            width: 14px;
            height: 14px;
        }

        /* Center button group */
        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 14px;
        }

        /* MEDIA — boxed style */
        .nav-btn.nav-media {
            border: 1.5px solid #1a1a1a;
            padding: 3px 12px;
            font-size: 9px;
            letter-spacing: 0.12em;
        }

        /* MEDIA active state */
        .nav-btn.nav-media.media-active {
            background: #1a1a1a;
            color: #ffffff;
        }

        /* Dark mode */
        [data-theme="dark"] .nav-footer {
            background: #1a1a1a;
            border-color: #555;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        [data-theme="dark"] .nav-btn {
            color: #e5e5e5;
        }

        [data-theme="dark"] .nav-btn.nav-media {
            border-color: #555;
        }

        [data-theme="dark"] .nav-btn.nav-media.media-active {
            background: #e5e5e5;
            color: #1a1a1a;
        }

        .chapter-indicator {
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media print {
            body { padding: 0; }
            .chapter-section { page-break-after: always; }
        }

        /* Hide chapter breaks when disabled */
        body.hide-chapter-breaks .chapter-header {
            display: none;
        }

        body.hide-chapter-breaks .chapter-section > .scene-break {
            display: none;
        }

        /* Font size classes */
        body.font-small .chapter-body {
            font-size: 0.9rem;
        }

        body.font-medium .chapter-body {
            font-size: 1rem;
        }

        body.font-large .chapter-body {
            font-size: 1.15rem;
        }

        /* ============================================
           MOBILE-FIRST RESPONSIVE ENHANCEMENTS
           Desktop (1024px+) remains unchanged
           ============================================ */

        /* Reduced Motion Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* iOS-Specific Fixes */
        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-text-size-adjust: 100%;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* Android-Specific Fixes */
        @supports (-webkit-appearance: none) {
            .nav-btn,
            .menu-btn {
                -webkit-appearance: none;
            }
        }

        /* Large Tablet (max-width: 1023px) */
        @media (max-width: 1023px) {
            body {
                padding-left: env(safe-area-inset-left, 20px);
                padding-right: env(safe-area-inset-right, 20px);
            }

            .header {
                padding-left: env(safe-area-inset-left, 0);
                padding-right: env(safe-area-inset-right, 0);
            }
        }

        /* Small Tablet / Large Phone (max-width: 767px) */
        @media (max-width: 767px) {
            body {
                padding-top: 80px;
                padding-bottom: 80px;
            }

            .chapter-section {
                margin-bottom: 30px;
            }

            .chapter-section .chapter-header {
                margin-top: 1.5em;
                margin-bottom: 1.5em;
                padding-bottom: 1em;
            }
        }

        /* Standard Phone - MAIN MOBILE (max-width: 599px) */
        @media (max-width: 599px) {
            /* Safe Area Insets */
            body {
                padding: 74px 16px 90px;
                padding-top: calc(74px + env(safe-area-inset-top, 0px));
                padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
                padding-left: max(16px, env(safe-area-inset-left, 16px));
                padding-right: max(16px, env(safe-area-inset-right, 16px));
            }

            .header {
                padding-top: env(safe-area-inset-top, 0);
            }

            .header-content {
                height: 64px;
                padding: 0 12px;
            }

            .header-logo-img {
                height: 24px;
            }

            /* Touch Targets - WCAG 2.1 AA (44x44px minimum) */
            .menu-btn {
                min-width: 44px;
                min-height: 44px;
                padding: 10px;
                -webkit-tap-highlight-color: transparent;
            }

            .menu-btn:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            /* Navigation Footer - Compact floating box */
            .nav-footer {
                bottom: max(12px, calc(env(safe-area-inset-bottom) + 4px));
                max-width: 250px;
                padding: 9px 12px;
            }

            .nav-btn {
                font-size: 10px;
                min-height: 44px;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                user-select: none;
            }

            .nav-btn.nav-media {
                font-size: 9px;
                padding: 3px 10px;
                min-height: 44px;
            }

            .nav-center {
                gap: 10px;
                margin: 0 10px;
            }

            /* Media Emoji Touch Targets */
            .media-emoji {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 32px;
                min-height: 32px;
                -webkit-tap-highlight-color: transparent;
            }

            .media-emoji:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            /* Spacing Adjustments */
            .chapter-section {
                margin-bottom: 24px;
            }

            .chapter-section .chapter-header {
                margin-top: 1em;
                margin-bottom: 1em;
                padding-bottom: 0.75em;
            }

            .chapter-section > .scene-break {
                margin: 1.5em 0 0 0;
            }

        }

        /* Small Phone - iPhone SE (max-width: 374px) */
        @media (max-width: 374px) {
            body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .header-content {
                padding: 0 8px;
            }

            .header-logo-img {
                height: 22px;
            }

            .nav-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .chapter-section .chapter-header {
                font-size: 0.9em;
            }
        }

        /* Landscape Mode on Short Screens */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding-top: 60px;
                padding-bottom: 60px;
            }

            .header-content {
                height: 50px;
            }

            .nav-footer {
                padding: 8px 10px;
            }

            .nav-btn {
                min-height: 36px;
            }
        }

        /* Binge mode link should appear selected in sidebar */
        .toc-top-section[data-section="full-book"] .toc-top-header {
            background: var(--color-bg-hover);
            font-weight: bold;
        }
    </style>

    <!-- FONT TEST: Times New Roman (System) -->
    <style>
        /* FONT TEST OVERRIDE - TIMES NEW ROMAN */
        .chapter-body, .chapter-body p {
            font-family: 'Times New Roman', Times, serif !important;
        }
    </style>
</head>

    <script>
        // Auth check - must run synchronously before content renders
        (function() {
            var session = localStorage.getItem('otr_beta_session');
            if (!session) {
                window.location.replace('./');
                return;
            }
            try {
                var data = JSON.parse(session);
                if (!data.authenticated || Date.now() > data.expires) {
                    localStorage.removeItem('otr_beta_session');
                    window.location.replace('./');
                    return;
                }
            } catch (e) {
                window.location.replace('./');
                return;
            }
            document.body.style.opacity = '1';
        })();
    </script>
    <script>
        // Apply body classes immediately (theme already set in <head>)
        if (localStorage.getItem('admin_showCaptions') === 'true') {
            document.body.classList.add('show-captions');
        }
        // User preference for clean-read (shared with main reader)
        if (localStorage.getItem('reader_cleanRead') === 'true') {
            document.body.classList.add('clean-read');
        }
        // Admin override takes precedence
        if (localStorage.getItem('admin_fullBookCleanRead') === 'true') {
            document.body.classList.add('clean-read');
        }
        if (localStorage.getItem('admin_fullBookChapterBreaks') === 'false') {
            document.body.classList.add('hide-chapter-breaks');
        }
        // Apply dateline formatting
        const datelineFormat = localStorage.getItem('admin_datelineFormat') || 'current';
        if (datelineFormat === 'bold-italic') {
            document.body.classList.add('dateline-bold-italic');
        } else if (datelineFormat === 'bold') {
            document.body.classList.add('dateline-bold');
        }
        // Apply font size
        const fontSize = localStorage.getItem('reader_fontSize') || 'medium';
        document.body.classList.add('font-' + fontSize);
    </script>

    <div class="overlay" id="overlay"></div>

    <!-- Binge Mode Core Logic -->
    <script type="module" src="../js/binge-init.min.js?v=423"></script>

    <!-- Overlay Failsafes -->
    <script src="../js/failsafes.js?v=423"></script>

    <!-- Sidebar Navigation (builds TOC identical to main reader) -->
    <script type="module">
        import { CHAPTERS, getChaptersByYear, getIntroChapters, getPostscriptChapters, getSortedYears } from './data/chapters.js';
        import { isChapterComplete } from './js/storage.min.js';

        // Wait for binge-init to set up globals
        const waitForInit = setInterval(() => {
            if (typeof window.CHAPTERS !== 'undefined' && typeof window.scrollToChapter !== 'undefined') {
                clearInterval(waitForInit);
                initBingeSidebar();
            }
        }, 50);

        function initBingeSidebar() {
            // DOM elements (same IDs as index.html)
            const menuBtn = document.getElementById('menuBtn');
            const closeTocBtn = document.getElementById('closeTocBtn');
            const tocSidebar = document.getElementById('tocSidebar');
            const overlay = document.getElementById('overlay');
            const tocContent = document.getElementById('tocContent');

            // Build TOC
            buildTOC();

            // Sidebar open/close
            function openTOC() {
                // Force instant collapse before sidebar becomes visible (no transition flash)
                const bookContent = document.getElementById('toc-book-content');
                const bookSection = tocContent.querySelector('[data-section="book"]');
                if (bookContent) {
                    bookContent.style.display = 'none';
                    bookContent.style.visibility = 'hidden';
                    bookContent.style.height = '0';
                    bookContent.classList.add('collapsed');
                }
                if (bookSection) {
                    bookSection.querySelector('.toc-top-header')?.classList.remove('expanded');
                }
                expandedSections.delete('book');
                // Restore display after collapse classes applied (CSS handles visibility via .collapsed)
                if (bookContent) {
                    bookContent.style.display = '';
                    bookContent.style.visibility = '';
                    bookContent.style.height = '';
                }

                tocSidebar.style.visibility = 'visible';
                tocSidebar.style.transform = '';
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '';
                tocSidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeTOC() {
                tocSidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
                setTimeout(() => {
                    if (!tocSidebar.classList.contains('open')) {
                        tocSidebar.style.visibility = 'hidden';
                        overlay.style.visibility = 'hidden';
                        // Collapse book section while sidebar is hidden (no visible animation)
                        expandedSections.delete('book');
                        const bookContent = document.getElementById('toc-book-content');
                        const bookSection = tocContent.querySelector('[data-section="book"]');
                        if (bookContent) bookContent.classList.add('collapsed');
                        if (bookSection) bookSection.querySelector('.toc-top-header')?.classList.remove('expanded');
                    }
                }, 310);
            }

            menuBtn.addEventListener('click', openTOC);
            closeTocBtn.addEventListener('click', closeTOC);
            overlay.addEventListener('click', closeTOC);

            // Touch support for iOS - use touchend with scroll detection
            let closeBtnTouchMoved = false;
            closeTocBtn.addEventListener('touchstart', () => { closeBtnTouchMoved = false; }, { passive: true });
            closeTocBtn.addEventListener('touchmove', () => { closeBtnTouchMoved = true; }, { passive: true });
            closeTocBtn.addEventListener('touchend', (e) => {
                if (!closeBtnTouchMoved) {
                    e.preventDefault();
                    closeTOC();
                }
            });

            let overlayTouchMoved = false;
            overlay.addEventListener('touchstart', () => { overlayTouchMoved = false; }, { passive: true });
            overlay.addEventListener('touchmove', () => { overlayTouchMoved = true; }, { passive: true });
            overlay.addEventListener('touchend', (e) => {
                if (!overlayTouchMoved) {
                    e.preventDefault();
                    closeTOC();
                }
            });

            // Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && tocSidebar.classList.contains('open')) {
                    closeTOC();
                }
            });

            // Build TOC structure (mirrors navigation.js)
            function buildTOC() {
                const fragment = document.createDocumentFragment();

                // BOOK section
                fragment.appendChild(createBookSection());

                // BINGE MODE link (current page - highlighted)
                fragment.appendChild(createTopSection({ id: 'full-book', label: 'BINGE MODE', type: 'link', url: './binge-mode.html', current: true }));

                // DOWNLOAD link
                fragment.appendChild(createTopSection({ id: 'download', label: 'DOWNLOAD', type: 'link', url: './downloadpage.html', current: false }));

                // GUESTBOOK link
                fragment.appendChild(createTopSection({ id: 'guestbook', label: 'GUESTBOOK', type: 'link', url: './guestbook.html', current: false }));

                // Divider
                const divider = document.createElement('div');
                divider.className = 'toc-divider';
                fragment.appendChild(divider);

                tocContent.appendChild(fragment);
            }

            // Create BOOK section with chapters
            function createBookSection() {
                const section = document.createElement('div');
                section.className = 'toc-top-section';
                section.dataset.section = 'book';

                const sectionHeader = document.createElement('div');
                sectionHeader.className = 'toc-top-header';

                const sectionTitle = document.createElement('h3');
                sectionTitle.className = 'toc-top-title';
                sectionTitle.textContent = 'OFF-THE-RECORD';

                sectionHeader.appendChild(sectionTitle);

                const bookContent = document.createElement('div');
                bookContent.className = 'toc-book-content collapsed';
                bookContent.id = 'toc-book-content';

                // Build chapter list
                buildBookContent(bookContent);

                sectionHeader.addEventListener('click', () => {
                    toggleTopSection('book', sectionHeader, bookContent);
                });

                section.appendChild(sectionHeader);
                section.appendChild(bookContent);

                return section;
            }

            // Build chapter items (flat list like navigation.js)
            function buildBookContent(container) {
                const frontMatter = CHAPTERS.filter(c => c.section === 'title' || c.section === 'toc');
                const introChapters = getIntroChapters();
                const chaptersByYear = getChaptersByYear();
                const years = getSortedYears();
                const postscriptChapters = getPostscriptChapters();

                frontMatter.forEach(chapter => {
                    container.appendChild(createChapterItem(chapter));
                });

                introChapters.forEach(chapter => {
                    container.appendChild(createChapterItem(chapter));
                });

                years.forEach(year => {
                    const chapters = chaptersByYear[year] || [];
                    chapters.forEach(chapter => {
                        container.appendChild(createChapterItem(chapter));
                    });
                });

                postscriptChapters.forEach(chapter => {
                    container.appendChild(createChapterItem(chapter));
                });
            }

            // Create chapter item
            function createChapterItem(chapter) {
                const item = document.createElement('div');
                item.className = 'toc-chapter';
                item.dataset.chapterId = chapter.id;

                const lockedChapters = JSON.parse(localStorage.getItem('admin_lockedChapters') || '[]');
                const isLocked = lockedChapters.includes(chapter.id);

                if (isLocked) {
                    item.classList.add('toc-chapter-locked');
                }

                const indicator = document.createElement('div');
                indicator.className = 'chapter-indicator';

                const info = document.createElement('div');
                info.className = 'toc-chapter-info';

                const titleRow = document.createElement('div');
                titleRow.className = 'toc-chapter-title-row';

                const title = document.createElement('span');
                title.className = 'toc-chapter-title';
                title.textContent = chapter.title;

                titleRow.appendChild(title);

                if (isLocked) {
                    const lockIcon = document.createElement('span');
                    lockIcon.className = 'toc-lock-icon';
                    lockIcon.textContent = '🔒';
                    titleRow.appendChild(lockIcon);
                }

                info.appendChild(titleRow);

                item.appendChild(indicator);
                item.appendChild(info);

                // Click handler - navigate to main reader at this chapter
                const handleChapterSelect = () => {
                    if (!isLocked) {
                        closeTOC();
                        window.location.href = './?chapter=' + chapter.id;
                    }
                };
                item.addEventListener('click', handleChapterSelect);

                // Mark completed chapters
                if (isChapterComplete(chapter.id)) {
                    item.classList.add('completed');
                    indicator.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                }

                return item;
            }

            // Create top section (BINGE MODE, DOWNLOAD, GUESTBOOK links)
            function createTopSection(section) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'toc-top-section';
                sectionDiv.dataset.section = section.id;

                // Use proper <a> tag for right-click, middle-click support
                const link = document.createElement('a');
                link.className = 'toc-top-header toc-top-link';
                link.href = section.url;

                const title = document.createElement('h3');
                title.className = 'toc-top-title';
                title.textContent = section.label;
                link.appendChild(title);

                // Current page styling
                if (section.current) {
                    link.style.cursor = 'default';
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                    });
                } else {
                    link.addEventListener('click', () => {
                        closeTOC();
                    });
                }

                sectionDiv.appendChild(link);
                return sectionDiv;
            }

            // Toggle section expand/collapse
            const expandedSections = new Set();
            function toggleTopSection(sectionId, sectionHeader, sectionContent) {
                if (expandedSections.has(sectionId)) {
                    expandedSections.delete(sectionId);
                    sectionContent.classList.add('collapsed');
                    sectionHeader.classList.remove('expanded');
                } else {
                    expandedSections.add(sectionId);
                    sectionContent.classList.remove('collapsed');
                    sectionHeader.classList.add('expanded');
                }
            }

            // Search functionality
            const searchToggle = document.getElementById('searchToggle');
            const searchContent = document.getElementById('searchContent');
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            const searchClear = document.getElementById('searchClear');

            searchToggle.addEventListener('click', () => {
                const isExpanded = searchContent.style.display !== 'none';
                searchContent.style.display = isExpanded ? 'none' : 'block';
                searchToggle.setAttribute('aria-expanded', !isExpanded);
                searchToggle.classList.toggle('expanded', !isExpanded);
                if (!isExpanded) searchInput.focus();
            });

            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim().toLowerCase();
                searchClear.style.display = query.length > 0 ? 'block' : 'none';

                if (query.length < 2) {
                    searchResults.style.display = 'none';
                    searchResults.innerHTML = '';
                    return;
                }

                const matches = [];
                CHAPTERS.forEach(ch => {
                    const titleMatch = ch.title.toLowerCase().includes(query);
                    const textContent = ch.content.replace(/<[^>]*>/g, '');
                    const contentMatch = textContent.toLowerCase().includes(query);

                    if (titleMatch || contentMatch) {
                        let snippet = '';
                        if (contentMatch && !titleMatch) {
                            const idx = textContent.toLowerCase().indexOf(query);
                            const start = Math.max(0, idx - 30);
                            const end = Math.min(textContent.length, idx + query.length + 30);
                            snippet = (start > 0 ? '...' : '') + textContent.slice(start, end) + (end < textContent.length ? '...' : '');
                        }
                        matches.push({ id: ch.id, title: ch.title, snippet });
                    }
                });

                if (matches.length === 0) {
                    searchResults.innerHTML = '<div class="search-result-item"><em>No results found</em></div>';
                } else {
                    searchResults.innerHTML = matches.slice(0, 10).map(m =>
                        `<div class="search-result-item" data-chapter-id="${m.id}">
                            <div class="search-result-title">${m.title}</div>
                            ${m.snippet ? `<div class="search-result-snippet">${m.snippet}</div>` : ''}
                        </div>`
                    ).join('');
                }
                searchResults.style.display = 'block';
            });

            searchResults.addEventListener('click', (e) => {
                const item = e.target.closest('.search-result-item');
                if (item && item.dataset.chapterId) {
                    closeTOC();
                    window.location.href = './?chapter=' + item.dataset.chapterId;
                }
            });

            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                searchResults.innerHTML = '';
                searchResults.style.display = 'none';
                searchClear.style.display = 'none';
                searchInput.focus();
            });

            // Options functionality
            const optionsToggle = document.getElementById('optionsToggle');
            const optionsContent = document.getElementById('optionsContent');
            const textSizeToggle = document.getElementById('textSizeToggle');

            optionsToggle.addEventListener('click', () => {
                const isExpanded = optionsContent.style.display !== 'none';
                optionsContent.style.display = isExpanded ? 'none' : 'block';
                optionsToggle.setAttribute('aria-expanded', !isExpanded);
                optionsToggle.classList.toggle('expanded', !isExpanded);
            });

            // Text size toggle
            const fontSizeKey = 'reader_fontSize';
            const currentSize = localStorage.getItem(fontSizeKey) || 'medium';
            textSizeToggle.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.size === currentSize);
                btn.addEventListener('click', () => {
                    const size = btn.dataset.size;
                    document.body.classList.remove('font-small', 'font-medium', 'font-large');
                    document.body.classList.add('font-' + size);
                    localStorage.setItem(fontSizeKey, size);
                    textSizeToggle.querySelectorAll('.option-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.size === size);
                    });
                });
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('otr_beta_session');
                window.location.href = './';
            });
        }
    </script>

</body>
