<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#ffffff">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="OFF-THE-RECORD">
    <meta property="og:image" content="https://anthonyfenech.github.io/off-the-record/assets/icons/icon-512.png">
    <meta property="og:url" content="https://anthonyfenech.github.io/off-the-record/binge-mode.html">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="OFF-THE-RECORD">
    <meta name="twitter:image" content="https://anthonyfenech.github.io/off-the-record/assets/icons/icon-512.png">

    <title>BINGE MODE</title>

    <!-- CRITICAL: Apply theme BEFORE CSS loads to prevent FOUC -->
    <script>
        (function() {
            if (localStorage.getItem('reader_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">

    <!-- Preload critical fonts -->
    <link rel="preload" href="./fonts/literata-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/literata-italic.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Preload critical CSS -->
    <link rel="preload" href="./css/variables.min.css" as="style">
    <link rel="preload" href="./css/typography.css" as="style">

    <!-- Self-hosted fonts (no external request) -->
    <link rel="stylesheet" href="./css/fonts.min.css">

    <link rel="stylesheet" href="./css/reset.min.css">
    <link rel="stylesheet" href="./css/variables.min.css">
    <link rel="stylesheet" href="./css/typography.css">
    <link rel="stylesheet" href="./css/layout.min.css">
    <link rel="stylesheet" href="./css/components.min.css">
    <link rel="stylesheet" href="./css/otr-tier1-states.css">

    <style>
        body {
            padding: 90px 20px 40px;
        }

        /* === PARAGRAPH FORMATTING === */
        .chapter-body p {
            text-indent: 0.5in !important;
            text-align: justify !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.6;
        }

        .chapter-body p.has-dateline {
            text-indent: 0 !important;
            margin-top: 1em !important;
        }

        .chapter-body p:empty {
            height: 1em;
            margin: 0 !important;
            padding: 0 !important;
        }

        .chapter-body p:first-child {
            text-indent: 0 !important;
        }

        .chapter-body .dateline {
            font-weight: 500;
        }

        /* Special formatting - preserve existing */
        .chapter-body p.scene-break {
            text-align: center !important;
            text-indent: 0 !important;
            margin: 1.5em 0 !important;
        }

        .chapter-body p.signature {
            text-align: right !important;
            text-indent: 0 !important;
            margin-top: 1.5em !important;
        }

        .chapter-body p.flashback-header,
        .chapter-body p.headline-block {
            text-indent: 0 !important;
        }

        .chapter-body .block-quote p {
            text-indent: 0 !important;
            margin-left: 2em !important;
        }

        /* Mobile: smaller indent, left-aligned for readability */
        @media (max-width: 600px) {
            .chapter-body p {
                text-indent: 24px !important;
                text-align: left !important;
            }
        }

        /* Sticky header - GPU accelerated */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--color-header-bg);
            border-bottom: 1px solid var(--color-border);
            will-change: transform;
            backface-visibility: hidden;
            transition: background-color var(--transition-fast);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 69px;
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-logo-img {
            height: 28px;
            width: auto;
        }

        .back-to-reader {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-primary);
            transition: opacity 0.15s ease;
        }

        .back-to-reader:hover {
            opacity: 0.7;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book {
            max-width: 680px;
            margin: 0 auto;
        }

        .chapter-section {
            margin-bottom: 40px;
            contain: layout style paint;
        }

        .chapter-section .chapter-header {
            margin-top: 2em;
            margin-bottom: 2em;
            padding-bottom: 1.5em;
            border-bottom: 1px solid var(--color-border);
        }

        .chapter-section .chapter-body {
            margin: 0;
        }

        /* Remove block quote styling for full book */
        .block-quote {
            margin: 0;
            padding: 0;
            border-left: none;
            background-color: transparent;
        }

        /* Scene breaks - centered with spacing */
        .scene-break {
            text-align: center;
            margin: 0;
            padding: var(--space-lg) 0;
        }

        /* Make flashback header bigger - match nav size */
        .flashback-header {
            font-size: 1.25rem;
            letter-spacing: 3px;
            margin: 0;
            padding: var(--space-lg) 0;
        }

        /* Hide emoji icon in modal header */
        .media-modal-icon {
            display: none;
        }

        /* Fix emoji display - must reset font smoothing for mobile */
        .media-emoji {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "EmojiOne Color", "Android Emoji", emoji, sans-serif !important;
            text-rendering: auto !important;
            -webkit-font-smoothing: auto !important;
            -moz-osx-font-smoothing: auto !important;
        }

        /* Smaller images in modal - desktop */
        .media-image {
            max-height: 450px;
            width: auto;
        }

        /* Smaller images on mobile */
        @media (max-width: 600px) {
            .media-image {
                max-height: 280px;
            }
        }

        /* Chapter end separator - centered between chapters */
        .chapter-end {
            text-align: center !important;
            display: block;
            width: 100%;
            padding: 2.5em 0;
            color: var(--color-text-tertiary);
            letter-spacing: 0.5em;
            font-size: 1.25rem;
        }

        /* Remove extra margin from chapter headers after chapter-end */
        .chapter-section + .chapter-section .chapter-header {
            margin-top: 0;
        }

        /* Navigation footer - GPU accelerated */
        .nav-footer {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background-color: var(--color-background);
            padding: var(--space-sm) var(--space-md);
            display: flex;
            justify-content: center;
            gap: var(--space-2xl);
            will-change: transform;
            backface-visibility: hidden;
        }

        .bookmark-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            color: var(--color-text);
            font-family: inherit;
            font-size: 14px;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .chapter-indicator {
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media print {
            body { padding: 0; }
            .chapter-section { page-break-after: always; }
        }

        /* Hide chapter breaks when disabled */
        body.hide-chapter-breaks .chapter-header {
            display: none;
        }

        body.hide-chapter-breaks .chapter-end {
            display: none;
        }

        /* ============================================
           MOBILE-FIRST RESPONSIVE ENHANCEMENTS
           Desktop (1024px+) remains unchanged
           ============================================ */

        /* Reduced Motion Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* iOS-Specific Fixes */
        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-text-size-adjust: 100%;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* Android-Specific Fixes */
        @supports (-webkit-appearance: none) {
            .nav-btn,
            .bookmark-btn,
            .back-to-reader,
            .menu-btn {
                -webkit-appearance: none;
            }
        }

        /* Large Tablet (max-width: 1023px) */
        @media (max-width: 1023px) {
            body {
                padding-left: env(safe-area-inset-left, 20px);
                padding-right: env(safe-area-inset-right, 20px);
            }

            .header {
                padding-left: env(safe-area-inset-left, 0);
                padding-right: env(safe-area-inset-right, 0);
            }
        }

        /* Small Tablet / Large Phone (max-width: 767px) */
        @media (max-width: 767px) {
            body {
                padding-top: 80px;
                padding-bottom: 80px;
            }

            .chapter-section {
                margin-bottom: 30px;
            }

            .chapter-section .chapter-header {
                margin-top: 1.5em;
                margin-bottom: 1.5em;
                padding-bottom: 1em;
            }
        }

        /* Standard Phone - MAIN MOBILE (max-width: 599px) */
        @media (max-width: 599px) {
            /* Safe Area Insets */
            body {
                padding: 74px 16px 90px;
                padding-top: calc(74px + env(safe-area-inset-top, 0px));
                padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
                padding-left: max(16px, env(safe-area-inset-left, 16px));
                padding-right: max(16px, env(safe-area-inset-right, 16px));
            }

            .header {
                padding-top: env(safe-area-inset-top, 0);
            }

            .header-content {
                height: 64px;
                padding: 0 12px;
            }

            .header-logo-img {
                height: 24px;
            }

            /* Touch Targets - WCAG 2.1 AA (44x44px minimum) */
            .back-to-reader {
                width: 48px;
                height: 48px;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                user-select: none;
            }

            .back-to-reader:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            .menu-btn {
                min-width: 44px;
                min-height: 44px;
                padding: 10px;
                -webkit-tap-highlight-color: transparent;
            }

            .menu-btn:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            /* Navigation Footer - Full Width Bottom Bar */
            .nav-footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                transform: none;
                border-radius: 0;
                box-shadow: none;
                border-top: 1px solid var(--color-border);
                padding: var(--space-sm) var(--space-md);
                padding-bottom: max(var(--space-sm), env(safe-area-inset-bottom, var(--space-sm)));
                gap: var(--space-lg);
                background-color: var(--color-background);
            }

            .nav-btn {
                min-width: 48px;
                min-height: 44px;
                padding: 10px 14px;
                font-size: 13px;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                user-select: none;
            }

            .nav-btn:active:not(:disabled) {
                opacity: 0.5;
                transform: scale(0.95);
            }

            .bookmark-btn {
                min-width: 44px;
                min-height: 44px;
                padding: 10px;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                user-select: none;
            }

            .bookmark-btn:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            /* Media Emoji Touch Targets */
            .media-emoji {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 32px;
                min-height: 32px;
                -webkit-tap-highlight-color: transparent;
            }

            .media-emoji:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            /* Spacing Adjustments */
            .chapter-section {
                margin-bottom: 24px;
            }

            .chapter-section .chapter-header {
                margin-top: 1em;
                margin-bottom: 1em;
                padding-bottom: 0.75em;
            }

            .scene-break {
                padding: var(--space-md) 0;
            }

            .flashback-header {
                font-size: 1.1rem;
                letter-spacing: 2px;
                padding: var(--space-md) 0;
            }

            .chapter-end {
                padding: 1.5em 0;
                font-size: 1.1rem;
            }

        }

        /* Small Phone - iPhone SE (max-width: 374px) */
        @media (max-width: 374px) {
            body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .header-content {
                padding: 0 8px;
            }

            .header-logo-img {
                height: 22px;
            }

            .nav-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .nav-btn span {
                display: none;
            }

            .nav-footer {
                gap: var(--space-xl);
            }

            .chapter-section .chapter-header {
                font-size: 0.9em;
            }
        }

        /* Landscape Mode on Short Screens */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding-top: 60px;
                padding-bottom: 60px;
            }

            .header-content {
                height: 50px;
            }

            .nav-footer {
                padding: var(--space-xs) var(--space-md);
            }

            .nav-btn {
                min-height: 36px;
                padding: 6px 10px;
            }

            .bookmark-btn {
                min-height: 36px;
                padding: 6px;
            }
        }
    </style>
</head>
<body style="opacity: 0;">
    <script>
        // Auth check - must run synchronously before content renders
        (function() {
            var session = localStorage.getItem('otr_beta_session');
            if (!session) {
                window.location.replace('./');
                return;
            }
            try {
                var data = JSON.parse(session);
                if (!data.authenticated || Date.now() > data.expires) {
                    localStorage.removeItem('otr_beta_session');
                    window.location.replace('./');
                    return;
                }
            } catch (e) {
                window.location.replace('./');
                return;
            }
            document.body.style.opacity = '1';
        })();
    </script>
    <script>
        // Apply body classes immediately (theme already set in <head>)
        if (localStorage.getItem('admin_showCaptions') === 'true') {
            document.body.classList.add('show-captions');
        }
        if (localStorage.getItem('admin_fullBookCleanRead') === 'true') {
            document.body.classList.add('clean-read');
        }
        if (localStorage.getItem('admin_fullBookChapterBreaks') === 'false') {
            document.body.classList.add('hide-chapter-breaks');
        }
        // Apply dateline formatting
        const datelineFormat = localStorage.getItem('admin_datelineFormat') || 'current';
        if (datelineFormat === 'bold-italic') {
            document.body.classList.add('dateline-bold-italic');
        } else if (datelineFormat === 'bold') {
            document.body.classList.add('dateline-bold');
        }
    </script>
    <!-- Header Navigation -->
    <header class="header" id="header">
        <div class="header-content">
            <a href="./" class="back-to-reader" aria-label="Back to reader">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </a>
            <a href="./" class="header-logo"><img src="./assets/icons/OTR-header.png" alt="OFF-THE-RECORD" class="header-logo-img"></a>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="book">
        <div id="content"></div>
    </main>

    <!-- Chapter Navigation Footer -->
    <nav class="nav-footer" id="navFooter">
        <button type="button" class="nav-btn nav-prev" id="prevBtn" aria-label="Previous chapter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Previous</span>
        </button>
        <button type="button" class="nav-btn nav-media" id="mediaBtn" aria-label="Toggle media visibility">
            <span>Media</span>
        </button>
        <button type="button" class="nav-btn nav-next" id="nextBtn" aria-label="Next chapter">
            <span>Next</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </nav>

    <!-- Binge Mode Core Logic -->
    <script type="module" src="./js/binge-init.min.js"></script>

    <!-- Theme Toggle -->
    <script src="./js/binge-theme.min.js"></script>

    <!-- Analytics & Bookmark -->
    <script src="./js/analytics.min.js"></script>
    <script src="./js/binge-analytics.min.js"></script>

    <!-- Live Prompts (Interactive Reader Prompts) -->
    <script src="./js/live-prompts.js"></script>

    <script src="./js/otr-tier1-error-handler.min.js"></script>

</body>
</html>
