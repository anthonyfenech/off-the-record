<!DOCTYPE html>

    <!-- CRITICAL: Apply theme BEFORE CSS loads to prevent FOUC -->
    <script>
        (function() {
            if (localStorage.getItem('reader_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- CRITICAL: Hide sidebar before CSS loads to prevent flash -->
    <style>.sidebar{visibility:hidden;transform:translateX(-100%)}.sidebar-overlay{visibility:hidden;opacity:0}</style>

    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">

    <link rel="preload" href="./fonts/literata-italic.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Preload critical CSS -->

    <link rel="preload" href="./css/typography.css?v=385" as="style">

    <style>
        body {
            padding: 90px 20px 40px;
        }

        /* === PARAGRAPH FORMATTING === */
        .chapter-body p {
            text-indent: 0.5in !important;
            text-align: justify !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.6;
        }

        .chapter-body p:empty {
            height: 1em;
            margin: 0 !important;
            padding: 0 !important;
        }

        .chapter-body p:first-child {
            text-indent: 0 !important;
        }

        .chapter-body .dateline {
            font-weight: 500;
        }

        .chapter-body p.headline-block {
            text-indent: 0 !important;
        }

        .chapter-body .block-quote p {
            text-indent: 0 !important;
            margin-left: 2em !important;
        }

        /* Mobile: smaller indent, left-aligned for readability */
        @media (max-width: 600px) {
            .chapter-body p {
                text-indent: 24px !important;
                text-align: left !important;
            }
        }

        /* Sticky header - GPU accelerated */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--color-header-bg);
            border-bottom: 1px solid var(--color-border);
            will-change: transform;
            backface-visibility: hidden;
            transition: background-color var(--transition-fast);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 69px;
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-logo-img {
            height: 28px;
            width: auto;
        }

        .back-to-reader {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-primary);
            transition: opacity 0.15s ease;
        }

        .back-to-reader:hover {
            opacity: 0.7;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book {
            max-width: 680px;
            margin: 0 auto;
        }

        .chapter-section {
            margin-bottom: 40px;
            contain: layout style paint;
        }

        .chapter-section .chapter-header {
            margin-top: 2em;
            margin-bottom: 2em;
            padding-bottom: 1.5em;
            border-bottom: 1px solid var(--color-border);
        }

        .chapter-section .chapter-body {
            margin: 0;
        }

        /* Remove block quote styling for full book */
        .block-quote {
            margin: 0;
            padding: 0;
            border-left: none;
            background-color: transparent;
        }

        /* Hide emoji icon in modal header */
        .media-modal-icon {
            display: none;
        }

        /* Fix emoji display - must reset font smoothing for mobile */
        .media-emoji {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "EmojiOne Color", "Android Emoji", emoji, sans-serif !important;
            text-rendering: auto !important;
            -webkit-font-smoothing: auto !important;
            -moz-osx-font-smoothing: auto !important;
        }

        /* Smaller images in modal - desktop */
        .media-image {
            max-height: 450px;
            width: auto;
        }

        /* Smaller images on mobile */
        @media (max-width: 600px) {
            .media-image {
                max-height: 280px;
            }
        }

        /* Chapter end separator - centered between chapters */
        .chapter-end {
            text-align: center !important;
            display: block;
            width: 100%;
            padding: 2.5em 0;
            color: var(--color-text-tertiary);
            letter-spacing: 0.5em;
            font-size: 1.25rem;
        }

        /* Remove extra margin from chapter headers after chapter-end */
        .chapter-section + .chapter-section .chapter-header {
            margin-top: 0;
        }

        /* Navigation footer — floating compact box */
        .nav-footer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: #ffffff;
            border: 1.5px solid #1a1a1a;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: auto;
            max-width: 260px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            gap: 0;
            will-change: transform;
            backface-visibility: hidden;
        }

        /* All nav buttons — base style */
        .nav-btn {
            font-family: 'Courier New', 'Courier Prime', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #1a1a1a;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0;
            white-space: nowrap;
            transition: opacity 0.15s ease;
        }

        .nav-btn:hover:not(:disabled) {
            opacity: 0.6;
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .nav-btn svg {
            width: 14px;
            height: 14px;
        }

        /* Center button group */
        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 14px;
        }

        /* MEDIA — boxed style */
        .nav-btn.nav-media {
            border: 1.5px solid #1a1a1a;
            padding: 3px 12px;
            font-size: 9px;
            letter-spacing: 0.12em;
        }

        /* MEDIA active state */
        .nav-btn.nav-media.media-active {
            background: #1a1a1a;
            color: #ffffff;
        }

        /* Dark mode */
        [data-theme="dark"] .nav-footer {
            background: #1a1a1a;
            border-color: #555;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        [data-theme="dark"] .nav-btn {
            color: #e5e5e5;
        }

        [data-theme="dark"] .nav-btn.nav-media {
            border-color: #555;
        }

        [data-theme="dark"] .nav-btn.nav-media.media-active {
            background: #e5e5e5;
            color: #1a1a1a;
        }

        .chapter-indicator {
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media print {
            body { padding: 0; }
            .chapter-section { page-break-after: always; }
        }

        /* Hide chapter breaks when disabled */
        body.hide-chapter-breaks .chapter-header {
            display: none;
        }

        body.hide-chapter-breaks .chapter-end {
            display: none;
        }

        /* ========== SIDEBAR ========== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
        }

        .sidebar-overlay.open {
            display: block;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: #fff;
            border-right: 2px solid var(--color-border);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 210;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            box-sizing: border-box;
            will-change: transform;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--color-border);
        }

        .sidebar-header-title {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Global sidebar button reset */
        .sidebar button {
            border: none;
            outline: none;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .sidebar-close {
            background: none !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            -webkit-appearance: none !important;
            appearance: none !important;
            -webkit-tap-highlight-color: transparent;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
            color: var(--color-text-primary);
            line-height: 1;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            opacity: 0.7;
        }

        .sidebar-nav {
            padding: 0;
        }

        .sidebar-link {
            padding: 0.75rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--color-text-primary);
            text-decoration: none;
            border-bottom: 1px solid var(--color-border);
            cursor: pointer;
            transition: background 0.15s;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .sidebar-link:hover {
            background: #f5f5f5;
        }

        .sidebar-link.active {
            background: #f0f0f0;
            font-weight: bold;
        }

        .sidebar-link.back-link {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .sidebar-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--color-border);
            cursor: pointer;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            color: var(--color-text-primary);
            min-height: 44px;
            transition: background 0.15s;
        }

        .sidebar-section-header:hover {
            background: #f5f5f5;
        }

        .sidebar-section-arrow {
            font-size: 0.75rem;
            transition: transform 0.2s;
        }

        .sidebar-section-header.expanded .sidebar-section-arrow {
            transform: rotate(180deg);
        }

        .sidebar-section-content {
            display: none;
            background: #fafafa;
        }

        .sidebar-section-content.expanded {
            display: block;
        }

        .sidebar-chapter-item {
            padding: 0.6rem 1rem 0.6rem 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--color-text-primary);
            text-decoration: none;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.15s;
            min-height: 44px;
            display: flex;
            align-items: center;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            text-align: left;
        }

        .sidebar-chapter-item:hover {
            background: #f0f0f0;
        }

        .sidebar-chapter-item.active {
            background: #e8e8e8;
            font-weight: bold;
        }

        .sidebar-search {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--color-border);
        }

        .sidebar-search-input {
            width: 100%;
            padding: 8px 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            border: 1px solid var(--color-border);
            border-radius: 0;
            outline: none;
            box-sizing: border-box;
        }

        .sidebar-search-input:focus {
            border-color: var(--color-text-primary);
        }

        .sidebar-search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
        }

        .sidebar-search-result {
            padding: 0.5rem 0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .sidebar-search-result:hover {
            color: var(--color-text-secondary);
        }

        .sidebar-search-result-title {
            font-weight: bold;
        }

        .sidebar-search-result-snippet {
            color: var(--color-text-secondary);
            margin-top: 2px;
        }

        .sidebar-font-toggle {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 0.75rem 1rem;
        }

        .sidebar-font-btn {
            flex: 1;
            padding: 8px;
            font-family: 'Courier New', monospace;
            border: 1px solid var(--color-border);
            background: #fff;
            cursor: pointer;
            text-align: center;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .sidebar-font-btn + .sidebar-font-btn {
            border-left: none;
        }

        .sidebar-font-btn:hover {
            background: #f5f5f5;
        }

        .sidebar-font-btn.active {
            background: var(--color-text-primary);
            color: #fff;
            border-color: var(--color-text-primary);
        }

        .sidebar-font-label {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            letter-spacing: 1px;
            padding: 0.75rem 1rem 0.25rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .sidebar-mode-toggle {
            padding: 0.75rem 1rem;
            opacity: 0.4;
            pointer-events: none;
        }

        .sidebar-mode-label {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            font-style: italic;
        }

        .sidebar-logout {
            padding: 0.75rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            text-decoration: none;
            border-top: 2px solid var(--color-border);
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            transition: background 0.15s;
            background: none;
            border-left: none;
            border-right: none;
            border-bottom: none;
            width: 100%;
            text-align: left;
        }

        .sidebar-logout:hover {
            background: #f5f5f5;
        }

        .sidebar-divider {
            height: 2px;
            background: var(--color-border);
            margin: 0;
        }

        body.font-small .chapter-body {
            font-size: 0.9rem;
        }

        body.font-medium .chapter-body {
            font-size: 1rem;
        }

        body.font-large .chapter-body {
            font-size: 1.15rem;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 70%;
            }
        }

        /* ============================================
           MOBILE-FIRST RESPONSIVE ENHANCEMENTS
           Desktop (1024px+) remains unchanged
           ============================================ */

        /* Reduced Motion Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* iOS-Specific Fixes */
        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-text-size-adjust: 100%;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* Android-Specific Fixes */
        @supports (-webkit-appearance: none) {
            .nav-btn,
            .back-to-reader,
            .menu-btn {
                -webkit-appearance: none;
            }
        }

        /* Large Tablet (max-width: 1023px) */
        @media (max-width: 1023px) {
            body {
                padding-left: env(safe-area-inset-left, 20px);
                padding-right: env(safe-area-inset-right, 20px);
            }

            .header {
                padding-left: env(safe-area-inset-left, 0);
                padding-right: env(safe-area-inset-right, 0);
            }
        }

        /* Small Tablet / Large Phone (max-width: 767px) */
        @media (max-width: 767px) {
            body {
                padding-top: 80px;
                padding-bottom: 80px;
            }

            .chapter-section {
                margin-bottom: 30px;
            }

            .chapter-section .chapter-header {
                margin-top: 1.5em;
                margin-bottom: 1.5em;
                padding-bottom: 1em;
            }
        }

        /* Standard Phone - MAIN MOBILE (max-width: 599px) */
        @media (max-width: 599px) {
            /* Safe Area Insets */
            body {
                padding: 74px 16px 90px;
                padding-top: calc(74px + env(safe-area-inset-top, 0px));
                padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
                padding-left: max(16px, env(safe-area-inset-left, 16px));
                padding-right: max(16px, env(safe-area-inset-right, 16px));
            }

            .header {
                padding-top: env(safe-area-inset-top, 0);
            }

            .header-content {
                height: 64px;
                padding: 0 12px;
            }

            .header-logo-img {
                height: 24px;
            }

            /* Touch Targets - WCAG 2.1 AA (44x44px minimum) */
            .back-to-reader {
                width: 48px;
                height: 48px;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                user-select: none;
            }

            .back-to-reader:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            .menu-btn {
                min-width: 44px;
                min-height: 44px;
                padding: 10px;
                -webkit-tap-highlight-color: transparent;
            }

            .menu-btn:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            /* Navigation Footer - Compact floating box */
            .nav-footer {
                bottom: max(12px, calc(env(safe-area-inset-bottom) + 4px));
                max-width: 250px;
                padding: 9px 12px;
            }

            .nav-btn {
                font-size: 10px;
                min-height: 44px;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                user-select: none;
            }

            .nav-btn.nav-media {
                font-size: 9px;
                padding: 3px 10px;
                min-height: 44px;
            }

            .nav-center {
                gap: 10px;
                margin: 0 10px;
            }

            /* Media Emoji Touch Targets */
            .media-emoji {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 32px;
                min-height: 32px;
                -webkit-tap-highlight-color: transparent;
            }

            .media-emoji:active {
                opacity: 0.5;
                transform: scale(0.95);
            }

            /* Spacing Adjustments */
            .chapter-section {
                margin-bottom: 24px;
            }

            .chapter-section .chapter-header {
                margin-top: 1em;
                margin-bottom: 1em;
                padding-bottom: 0.75em;
            }

            .chapter-end {
                padding: 1.5em 0;
                font-size: 1.1rem;
            }

        }

        /* Small Phone - iPhone SE (max-width: 374px) */
        @media (max-width: 374px) {
            body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .header-content {
                padding: 0 8px;
            }

            .header-logo-img {
                height: 22px;
            }

            .nav-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .chapter-section .chapter-header {
                font-size: 0.9em;
            }
        }

        /* Landscape Mode on Short Screens */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding-top: 60px;
                padding-bottom: 60px;
            }

            .header-content {
                height: 50px;
            }

            .nav-footer {
                padding: 8px 10px;
            }

            .nav-btn {
                min-height: 36px;
            }
        }
    </style>
</head>
<body style="opacity: 0;">
    <script>
        // TEMP: password bypass for testing — remove before launch
        localStorage.setItem('otr_beta_session', JSON.stringify({
            authenticated: true,
            expires: Date.now() + (365 * 24 * 60 * 60 * 1000) // 1 year
        }));
    </script>
    <script>
        // Auth check - must run synchronously before content renders
        (function() {
            var session = localStorage.getItem('otr_beta_session');
            if (!session) {
                window.location.replace('./');
                return;
            }
            try {
                var data = JSON.parse(session);
                if (!data.authenticated || Date.now() > data.expires) {
                    localStorage.removeItem('otr_beta_session');
                    window.location.replace('./');
                    return;
                }
            } catch (e) {
                window.location.replace('./');
                return;
            }
            document.body.style.opacity = '1';
        })();
    </script>
    <script>
        // Apply body classes immediately (theme already set in <head>)
        if (localStorage.getItem('admin_showCaptions') === 'true') {
            document.body.classList.add('show-captions');
        }
        // User preference for clean-read (shared with main reader)
        if (localStorage.getItem('reader_cleanRead') === 'true') {
            document.body.classList.add('clean-read');
        }
        // Admin override takes precedence
        if (localStorage.getItem('admin_fullBookCleanRead') === 'true') {
            document.body.classList.add('clean-read');
        }
        if (localStorage.getItem('admin_fullBookChapterBreaks') === 'false') {
            document.body.classList.add('hide-chapter-breaks');
        }
        // Apply dateline formatting
        const datelineFormat = localStorage.getItem('admin_datelineFormat') || 'current';
        if (datelineFormat === 'bold-italic') {
            document.body.classList.add('dateline-bold-italic');
        } else if (datelineFormat === 'bold') {
            document.body.classList.add('dateline-bold');
        }
    </script>

    <!-- Binge Mode Core Logic -->

    <!-- Sidebar Navigation -->
    <script type="module">
        // Wait for binge-init to set up globals
        const waitForInit = setInterval(() => {
            if (typeof CHAPTERS !== 'undefined' && typeof scrollToChapter !== 'undefined') {
                clearInterval(waitForInit);
                initSidebar();
            }
        }, 50);

        function initSidebar() {
            // ========== SIDEBAR ==========
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const sidebarClose = document.getElementById('sidebarClose');

            function openSidebar() {
                // Remove critical CSS overrides
                sidebar.style.visibility = 'visible';
                sidebar.style.transform = '';
                sidebarOverlay.style.visibility = 'visible';
                sidebarOverlay.style.opacity = '';
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
                sidebarClose.focus();
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('open');
                document.body.style.overflow = '';
                hamburgerBtn.focus();
                // Re-add hard hide after transition
                setTimeout(() => {
                    if (!sidebar.classList.contains('open')) {
                        sidebar.style.visibility = 'hidden';
                        sidebarOverlay.style.visibility = 'hidden';
                    }
                }, 310);
            }

            hamburgerBtn.addEventListener('click', openSidebar);
            sidebarClose.addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            // Touch event support for mobile (iOS especially)
            sidebarClose.addEventListener('touchstart', (e) => {
                e.preventDefault();
                closeSidebar();
            });
            sidebarOverlay.addEventListener('touchstart', (e) => {
                e.preventDefault();
                closeSidebar();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            sidebar.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    const focusable = sidebar.querySelectorAll('button, a, input, [tabindex]:not([tabindex="-1"])');
                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            });

            // Generate chapter list from CHAPTERS array
            const chaptersList = document.getElementById('chaptersList');
            chaptersList.innerHTML = CHAPTERS.map((ch, i) => {
                const isSpecial = ch.section === 'title' || ch.section === 'toc';
                const numLabel = '';
                return `<button class="sidebar-chapter-item" data-chapter-index="${i}" data-chapter-id="${ch.id}">
                    ${ch.title}
                </button>`;
            }).join('');

            function handleChapterClick(e) {
                const btn = e.target.closest('.sidebar-chapter-item');
                if (!btn) return;
                const idx = parseInt(btn.dataset.chapterIndex);
                closeSidebar();
                scrollToChapter(idx);
            }
            chaptersList.addEventListener('click', handleChapterClick);
            chaptersList.addEventListener('touchstart', (e) => {
                const btn = e.target.closest('.sidebar-chapter-item');
                if (!btn) return;
                e.preventDefault();
                handleChapterClick(e);
            });

            function updateSidebarHighlight() {
                chaptersList.querySelectorAll('.sidebar-chapter-item').forEach(item => {
                    const idx = parseInt(item.dataset.chapterIndex);
                    item.classList.toggle('active', idx === currentChapter);
                });
            }

            const sidebarObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        updateSidebarHighlight();
                    }
                });
            }, { rootMargin: '-80px 0px -50% 0px', threshold: 0 });
            chapters.forEach(ch => sidebarObserver.observe(ch));

            updateSidebarHighlight();

            // Collapsible sections
            function setupCollapsible(toggleId, contentId) {
                const toggle = document.getElementById(toggleId);
                const content = document.getElementById(contentId);
                toggle.addEventListener('click', () => {
                    toggle.classList.toggle('expanded');
                    content.classList.toggle('expanded');
                });
            }

            document.getElementById('chaptersToggle').classList.add('expanded');
            setupCollapsible('chaptersToggle', 'chaptersList');
            setupCollapsible('searchToggle', 'searchSection');
            setupCollapsible('optionsToggle', 'optionsSection');

            // Font size toggle
            const fontSizeKey = 'reader_fontSize';
            const fontSizes = ['small', 'medium', 'large'];
            const fontBtns = document.querySelectorAll('.sidebar-font-btn');

            function applyFontSize(size) {
                fontSizes.forEach(s => document.body.classList.remove(`font-${s}`));
                document.body.classList.add(`font-${size}`);
                localStorage.setItem(fontSizeKey, size);
                fontBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.size === size);
                });
            }

            const savedFontSize = localStorage.getItem(fontSizeKey) || 'medium';
            applyFontSize(savedFontSize);

            fontBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    applyFontSize(btn.dataset.size);
                });
            });

            // Search functionality
            const searchInput = document.getElementById('sidebarSearchInput');
            const searchResults = document.getElementById('sidebarSearchResults');

            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim().toLowerCase();
                if (query.length < 2) {
                    searchResults.innerHTML = '';
                    return;
                }

                const matches = [];
                CHAPTERS.forEach((ch, i) => {
                    const titleMatch = ch.title.toLowerCase().includes(query);
                    const textContent = ch.content.replace(/<[^>]*>/g, '');
                    const contentMatch = textContent.toLowerCase().includes(query);

                    if (titleMatch || contentMatch) {
                        let snippet = '';
                        if (contentMatch && !titleMatch) {
                            const idx = textContent.toLowerCase().indexOf(query);
                            const start = Math.max(0, idx - 30);
                            const end = Math.min(textContent.length, idx + query.length + 30);
                            snippet = (start > 0 ? '...' : '') + textContent.slice(start, end) + (end < textContent.length ? '...' : '');
                        }
                        matches.push({ index: i, title: ch.title, snippet, id: ch.id });
                    }
                });

                if (matches.length === 0) {
                    searchResults.innerHTML = '<div class="sidebar-search-result"><em>No results found</em></div>';
                    return;
                }

                searchResults.innerHTML = matches.slice(0, 15).map(m =>
                    `<div class="sidebar-search-result" data-index="${m.index}">
                        <div class="sidebar-search-result-title">${m.title}</div>
                        ${m.snippet ? `<div class="sidebar-search-result-snippet">${m.snippet}</div>` : ''}
                    </div>`
                ).join('');
            });

            searchResults.addEventListener('click', (e) => {
                const result = e.target.closest('.sidebar-search-result');
                if (!result || !result.dataset.index) return;
                const idx = parseInt(result.dataset.index);
                closeSidebar();
                scrollToChapter(idx);
            });

            // Logout
            document.getElementById('sidebarLogout').addEventListener('click', () => {
                localStorage.removeItem('otr_access');
                window.location.href = './';
            });
        }
    </script>
