<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Map - Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #e8e8e8;
      min-height: 100vh;
    }

    /* ════════════════════════════════════════════════════
       LAYOUT
       ════════════════════════════════════════════════════ */

    .layout {
      display: block;
      min-height: 100vh;
    }

    /* ════════════════════════════════════════════════════
       MAIN PANEL (Left)
       ════════════════════════════════════════════════════ */

    .main-panel {
      padding: 20px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #333;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .hamburger:hover {
      background: #ddd;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: #333;
      border-radius: 1px;
    }

    .header h1 {
      font-size: 20px;
      letter-spacing: 1px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.15s;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-section { background: #4CAF50; color: white; }
    .btn-break { background: #666; color: white; }
    .btn-undo { background: #9c27b0; color: white; }
    .btn-save { background: #2196F3; color: white; }
    .btn-analytics {
      background: #9c27b0;
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-analytics:hover { background: #7b1fa2; }

    .btn-save:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .btn-save.has-changes {
      background: #ff9800;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,152,0,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,152,0,0); }
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #666;
      flex-wrap: wrap;
    }

    .stats strong { color: #333; }

    .unsaved-badge {
      background: #ff9800;
      color: white;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      margin-left: auto;
      display: none;
    }

    .unsaved-badge.visible { display: inline-block; }

    /* ════════════════════════════════════════════════════
       CONTENT GRID
       ════════════════════════════════════════════════════ */

    .grid {
      display: grid;
      grid-template-rows: repeat(51, auto);
      grid-auto-flow: column;
      grid-auto-columns: 150px;
      gap: 4px;
      min-height: 200px;
      padding: 6px;
      background: #f5f5f5;
      border-radius: 8px;
      border: 2px dashed transparent;
      transition: all 0.2s;
    }

    .grid.drag-target {
      border-color: #4CAF50;
      background: #e8f5e9;
    }

    /* ════════════════════════════════════════════════════
       SECTION BOX
       ════════════════════════════════════════════════════ */

    .box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 4px 6px;
      min-height: 42px;
      position: relative;
      cursor: grab;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      user-select: none;
    }

    .box:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    .box.dragging {
      opacity: 0.3;
      transform: scale(0.95);
    }

    .box.drag-over {
      border-color: #2196F3;
      background: #e3f2fd;
      transform: scale(1.02);
    }

    /* PAID = Yellow */
    .box.paid {
      background: #fffde7;
      border-color: #fbc02d;
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2px;
    }

    .box-title-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }

    .box-number {
      background: #333;
      color: white;
      min-width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .box.paid .box-number { background: #f9a825; }

    .box-lock {
      font-size: 10px;
      flex-shrink: 0;
    }

    .box-excerpt-badge {
      position: absolute;
      top: -4px;
      right: 16px;
      background: #2196F3;
      color: white;
      font-size: 6px;
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .box-title {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      line-height: 1.2;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .box-meta {
      font-size: 8px;
      color: #888;
      display: flex;
      justify-content: space-between;
      margin-top: 1px;
      padding-right: 16px;
    }

    .box-meta span {
      white-space: nowrap;
    }

    .box-delete {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 10px;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .box-delete:hover {
      background: #ffebee;
      color: #e53935;
    }

    /* ════════════════════════════════════════════════════
       CHAPTER BOX (inverted section box)
       ════════════════════════════════════════════════════ */

    .box.chapter-break {
      background: #333;
      border-color: #333;
      color: white;
    }

    .box.chapter-break .box-title {
      color: white;
    }

    .box.chapter-break .box-meta {
      color: #aaa;
    }

    .box.chapter-break .box-number {
      background: #f0c040;
      color: #333;
    }

    .box.chapter-break .box-delete {
      color: #666;
    }

    .box.chapter-break .box-delete:hover {
      background: rgba(255,255,255,0.1);
      color: #ef5350;
    }

    .box.chapter-break:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    /* Add buttons */
    .add-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    /* ════════════════════════════════════════════════════
       CUTTING ROOM FLOOR (Slide-out Sidebar)
       ════════════════════════════════════════════════════ */

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 998;
    }

    .sidebar-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100%;
      background: #263238;
      color: white;
      padding: 15px;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 999;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #455a64;
    }

    .sidebar-header h2 {
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sidebar-close {
      background: none;
      border: none;
      color: #90a4ae;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .sidebar-close:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* Category Filter */
    .category-filter {
      margin-bottom: 15px;
    }

    .category-filter select {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #455a64;
      color: white;
      font-size: 13px;
    }

    /* Floor List */
    .floor-list {
      min-height: 150px;
      padding: 8px;
      background: #1e272c;
      border-radius: 6px;
      border: 2px dashed transparent;
      transition: all 0.2s;
    }

    .floor-list.drag-target {
      border-color: #ff9800;
      background: #3e2723;
    }

    .floor-empty {
      color: #78909c;
      font-size: 12px;
      text-align: center;
      padding: 30px 10px;
    }

    /* Floor Item - matches .box style */
    .floor-item {
      background: #37474f;
      border: 2px solid #263238;
      border-radius: 5px;
      padding: 6px 8px;
      min-height: 58px;
      margin-bottom: 6px;
      cursor: grab;
      transition: all 0.15s;
      position: relative;
    }

    .floor-item:hover {
      background: #455a64;
    }

    .floor-item.dragging {
      opacity: 0.3;
    }

    .floor-item.drag-over {
      background: #4e342e;
      transform: scale(1.02);
    }

    .floor-item-category {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .floor-item-category.needs-work { color: #ffb74d; }
    .floor-item-category.too-long { color: #e57373; }
    .floor-item-category.off-topic { color: #90a4ae; }
    .floor-item-category.save-later { color: #81c784; }

    .floor-item-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1.2;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 16px;
    }

    .floor-item-meta {
      font-size: 9px;
      color: #90a4ae;
      margin-top: 2px;
    }

    .floor-item-edition {
      font-size: 8px;
      color: #90caf9;
      margin-top: 1px;
      font-style: italic;
    }

    .floor-item-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      background: none;
      border: none;
      color: #607d8b;
      cursor: pointer;
      font-size: 12px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .floor-item-delete:hover {
      background: rgba(255,255,255,0.1);
      color: #ef5350;
    }

    /* Add to floor button */
    .btn-add-floor {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #455a64;
      color: white;
      border: 2px dashed #607d8b;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-add-floor:hover {
      background: #546e7a;
    }

    /* Floor stats */
    .floor-stats {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #455a64;
      font-size: 11px;
      color: #90a4ae;
    }

    /* ════════════════════════════════════════════════════
       DETAIL PANEL (Click on box)
       ════════════════════════════════════════════════════ */

    .detail-panel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .detail-panel.open { display: flex; }

    .detail-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .detail-number {
      background: #333;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .detail-number.paid { background: #f9a825; }

    .detail-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
      line-height: 1;
    }

    .detail-close:hover { color: #333; }

    .detail-field {
      margin-bottom: 18px;
    }

    .detail-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 6px;
    }

    .detail-field input,
    .detail-field textarea,
    .detail-field select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
    }

    .detail-field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .detail-field input:focus,
    .detail-field textarea:focus,
    .detail-field select:focus {
      outline: none;
      border-color: #2196F3;
    }

    .detail-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .detail-toggle:hover {
      background: #eee;
    }

    .detail-toggle.active {
      background: #fffde7;
    }

    .excerpt-toggle.active {
      background: #e3f2fd;
    }

    .detail-toggle-icon {
      font-size: 20px;
    }

    .detail-toggle-text {
      flex: 1;
    }

    .detail-toggle-text strong {
      display: block;
      font-size: 13px;
    }

    .detail-toggle-text span {
      font-size: 11px;
      color: #666;
    }

    .detail-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .detail-field-half {
      flex: 1;
      margin-bottom: 0;
    }

    .detail-field-third {
      flex: 1;
      margin-bottom: 0;
    }

    .detail-field input[type="number"] {
      text-align: center;
      font-weight: 600;
    }

    .detail-field input[type="date"] {
      font-size: 13px;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .detail-actions .btn {
      flex: 1;
    }

    .btn-danger {
      background: #e53935;
      color: white;
    }

    .btn-secondary {
      background: #eee;
      color: #333;
    }

    /* ════════════════════════════════════════════════════
       ADD MODAL
       ════════════════════════════════════════════════════ */

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      margin-bottom: 15px;
    }

    .modal-content label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
    }

    .modal-content input,
    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
    }

    .modal-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .modal-field-half {
      flex: 1;
    }

    .modal-field-half label {
      display: block;
      margin-top: 0;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* ════════════════════════════════════════════════════
       RESPONSIVE
       ════════════════════════════════════════════════════ */

    @media (max-width: 900px) {
      .grid {
        grid-template-rows: repeat(25, auto);
      }
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-rows: repeat(15, auto);
      }
    }

    @media (max-width: 500px) {
      .grid {
        grid-template-rows: none;
        grid-auto-flow: row;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- CUTTING ROOM FLOOR SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>✂️ Cutting Room</h2>
    <button class="sidebar-close" id="sidebarClose">×</button>
  </div>

  <div class="category-filter">
    <select id="floorFilter">
      <option value="all">All Categories</option>
      <option value="needs-work">⚠️ Needs Work</option>
      <option value="too-long">📏 Too Long</option>
      <option value="off-topic">🚫 Off-Topic</option>
      <option value="save-later">🔄 Save for Later</option>
    </select>
  </div>

  <div class="floor-list" id="floorList"></div>

  <button class="btn-add-floor" id="addFloorBtn">+ Add to Floor</button>

  <div class="floor-stats">
    <span>Floor items: <strong id="floorCount">0</strong></span>
  </div>
</div>

<div class="layout">

  <!-- MAIN PANEL -->
  <div class="main-panel">
    <div class="header">
      <div class="header-left">
        <button class="hamburger" id="hamburgerBtn" title="Cutting Room">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <h1>CONTENT MAP</h1>
      </div>
      <div class="header-buttons">
        <button class="btn btn-undo" id="undoBtn" disabled title="Undo (Ctrl+Z)">↩</button>
        <a href="https://docs.google.com/spreadsheets/d/1wgf9HTdj8ROQHYJ3o_8JHF6UPT0TkKkYU7afCgRhOgY/edit?gid=0#gid=0"
           target="_blank"
           class="btn btn-analytics"
           title="View Analytics">📊 ANALYTICS</a>
        <button class="btn btn-save" id="saveBtn" disabled title="Save (Ctrl+S)">💾 SAVE</button>
      </div>
    </div>

    <div class="stats">
      <span>Items: <strong id="itemCount">0</strong></span>
      <span>Free: <strong id="freeCount">0</strong></span>
      <span>Paid: <strong id="paidCount">0</strong></span>
      <span>Excerpts: <strong id="excerptCount">0</strong></span>
      <span>Words: <strong id="wordCount">0</strong></span>
      <span class="unsaved-badge" id="unsavedBadge">UNSAVED</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="add-buttons">
      <button class="btn btn-section" id="addSectionBtn">+ Section</button>
      <button class="btn btn-break" id="addBreakBtn">+ Chapter Break</button>
    </div>
  </div>

</div>

<!-- DETAIL PANEL -->
<div class="detail-panel" id="detailPanel">
  <div class="detail-content">
    <div class="detail-header">
      <div class="detail-number" id="detailNumber">1</div>
      <button class="detail-close" id="detailClose">×</button>
    </div>

    <div class="detail-field">
      <label>Title</label>
      <input type="text" id="detailTitle">
    </div>

    <div class="detail-row">
      <div class="detail-field detail-field-third">
        <label>Word Count</label>
        <input type="number" id="detailWords" min="0" placeholder="0">
      </div>
      <div class="detail-field detail-field-third">
        <label>Date</label>
        <input type="date" id="detailDate">
      </div>
      <div class="detail-field detail-field-third">
        <label>Edition</label>
        <select id="detailEdition">
          <option value="">— Select —</option>
          <option value="original">Original Manuscript</option>
          <option value="hardcover">Hardcover Edition</option>
          <option value="paperback">Paperback Edition</option>
          <option value="ebook">E-Book Edition</option>
          <option value="audiobook">Audiobook Edition</option>
          <option value="serialized">Serialized/Web</option>
          <option value="directors-cut">Director's Cut</option>
          <option value="new">New Material</option>
        </select>
      </div>
    </div>

const REAL_FLOOR = [];

// ══════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════

const CATEGORY_ICONS = {
  'needs-work': '⚠️',
  'too-long': '📏',
  'off-topic': '🚫',
  'save-later': '🔄'
};

const EDITION_LABELS = {
  'original': 'Original Manuscript',
  'hardcover': 'Hardcover',
  'paperback': 'Paperback',
  'ebook': 'E-Book',
  'audiobook': 'Audiobook',
  'serialized': 'Serialized/Web',
  'directors-cut': "Director's Cut",
  'new': 'New Material'
};

// ══════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const year = String(d.getFullYear()).slice(-2);
  return `${month}/${day}/${year}`;
}

function abbreviateMonths(str) {
  return str
    .replace(/\bJANUARY\b/gi, 'JAN')
    .replace(/\bFEBRUARY\b/gi, 'FEB')
    .replace(/\bMARCH\b/gi, 'MAR')
    .replace(/\bAPRIL\b/gi, 'APR')
    .replace(/\bJUNE\b/gi, 'JUN')
    .replace(/\bJULY\b/gi, 'JUL')
    .replace(/\bAUGUST\b/gi, 'AUG')
    .replace(/\bSEPTEMBER\b/gi, 'SEP')
    .replace(/\bOCTOBER\b/gi, 'OCT')
    .replace(/\bNOVEMBER\b/gi, 'NOV')
    .replace(/\bDECEMBER\b/gi, 'DEC');
}

// ══════════════════════════════════════════════════════════
// LOAD / SAVE
// ══════════════════════════════════════════════════════════

function loadData() {
  const savedBook = localStorage.getItem('contentMap_book');
  const savedFloor = localStorage.getItem('contentMap_floor');

  if (savedBook) {
    bookItems = JSON.parse(savedBook);
  } else {
    bookItems = JSON.parse(JSON.stringify(REAL_DATA));
  }

  if (savedFloor) {
    floorItems = JSON.parse(savedFloor);
  } else {
    floorItems = JSON.parse(JSON.stringify(REAL_FLOOR));
  }

  render();
}

function saveData() {
  localStorage.setItem('contentMap_book', JSON.stringify(bookItems));
  localStorage.setItem('contentMap_floor', JSON.stringify(floorItems));
  hasChanges = false;
  updateUI();
  showToast('Saved!');
}

function saveState() {
  history.push({
    book: JSON.parse(JSON.stringify(bookItems)),
    floor: JSON.parse(JSON.stringify(floorItems))
  });
  if (history.length > 20) history.shift();
  hasChanges = true;
  updateUI();
}

function undo() {
  if (history.length === 0) return;
  const prev = history.pop();
  bookItems = prev.book;
  floorItems = prev.floor;
  hasChanges = true;
  updateUI();
  render();
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════

function render() {
  renderBook();
  renderFloor();
  updateStats();
}

function renderBook() {
  const grid = document.getElementById('grid');
  let itemNum = 0;

  grid.innerHTML = bookItems.map(item => {
    itemNum++;
    const title = escapeHtml(item.title);
    const words = item.words || 0;
    const dateStr = item.date ? formatDate(item.date) : '';

    if (item.type === 'break') {
      // Chapter box - same structure as section, inverted colors
      const chapterTitle = title.replace(/^Chapter\s+\d+:\s*/i, '');
      return `
        <div class="box chapter-break" data-id="${item.id}" data-source="book" draggable="true">
          <div class="box-header">
            <div class="box-title-row">
              <span class="box-number">${itemNum}</span>
              <span class="box-title">${chapterTitle}</span>
            </div>
          </div>
          <div class="box-meta">
            ${dateStr ? `<span>${dateStr}</span>` : '<span>—</span>'}
            <span>${words.toLocaleString()}</span>
          </div>
          <button class="box-delete" data-action="cut" title="Send to Cutting Room">✂️</button>
        </div>
      `;
    } else {
      // Section box
      const shortTitle = abbreviateMonths(title);
      return `
        <div class="box ${item.paid ? 'paid' : ''}" data-id="${item.id}" data-source="book" draggable="true">
          ${item.excerpt ? '<span class="box-excerpt-badge">Excerpt</span>' : ''}
          <div class="box-header">
            <div class="box-title-row">
              <span class="box-number">${itemNum}</span>
              <span class="box-title">${shortTitle}</span>
            </div>
            ${item.paid ? '<span class="box-lock">🔒</span>' : ''}
          </div>
          <div class="box-meta">
            ${dateStr ? `<span>${dateStr}</span>` : '<span>—</span>'}
            <span>${words.toLocaleString()}</span>
          </div>
          <button class="box-delete" data-action="cut" title="Send to Cutting Room">✂️</button>
        </div>
      `;
    }
  }).join('');
}

function renderFloor() {
  const list = document.getElementById('floorList');
  const filter = document.getElementById('floorFilter').value;

  const filtered = filter === 'all'
    ? floorItems
    : floorItems.filter(i => i.category === filter);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="floor-empty">Drag sections here<br>or click ✂️ to cut</div>';
    return;
  }

  list.innerHTML = filtered.map(item => {
    const title = escapeHtml(item.title);
    const dateStr = item.date ? formatDate(item.date) : '';
    const categoryLabel = item.category ? item.category.replace('-', ' ') : '';
    return `
    <div class="floor-item" data-id="${item.id}" data-source="floor" draggable="true">
      <div class="floor-item-category ${item.category || ''}">
        ${CATEGORY_ICONS[item.category] || ''} ${categoryLabel}
      </div>
      <div class="floor-item-title">${title}</div>
      <div class="floor-item-meta">${(item.words || 0).toLocaleString()} words${dateStr ? ` · ${dateStr}` : ''}</div>
      ${item.edition ? `<div class="floor-item-edition">From: ${EDITION_LABELS[item.edition] || escapeHtml(item.edition)}</div>` : ''}
      <button class="floor-item-delete" data-action="delete-floor" title="Delete permanently">×</button>
    </div>
  `}).join('');
}

function updateStats() {
  const sections = bookItems.filter(i => i.type === 'section');
  const totalWords = bookItems.reduce((sum, s) => sum + (s.words || 0), 0);

  document.getElementById('itemCount').textContent = bookItems.length;
  document.getElementById('freeCount').textContent = sections.filter(s => !s.paid).length;
  document.getElementById('paidCount').textContent = sections.filter(s => s.paid).length;
  document.getElementById('excerptCount').textContent = sections.filter(s => s.excerpt).length;
  document.getElementById('wordCount').textContent = totalWords.toLocaleString();
  document.getElementById('floorCount').textContent = floorItems.length;
}

function updateUI() {
  const saveBtn = document.getElementById('saveBtn');
  const undoBtn = document.getElementById('undoBtn');
  const badge = document.getElementById('unsavedBadge');

  saveBtn.disabled = !hasChanges;
  saveBtn.classList.toggle('has-changes', hasChanges);
  undoBtn.disabled = history.length === 0;
  badge.classList.toggle('visible', hasChanges);
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:5px;z-index:9999;';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// ══════════════════════════════════════════════════════════
// DETAIL PANEL
// ══════════════════════════════════════════════════════════

function openDetail(id) {
  const item = bookItems.find(i => i.id === id);
  if (!item) return;

  currentDetailId = id;

  // Find item number (sequential for all items)
  let itemNum = 0;
  for (const i of bookItems) {
    itemNum++;
    if (i.id === id) break;
  }

  const detailNum = document.getElementById('detailNumber');
  detailNum.textContent = itemNum;
  detailNum.classList.toggle('paid', item.paid);
  // Chapter boxes get gold badge in modal too
  detailNum.style.background = item.type === 'break' ? '#f0c040' : (item.paid ? '#f9a825' : '#333');
  detailNum.style.color = item.type === 'break' ? '#333' : 'white';

  document.getElementById('detailTitle').value = item.title;
  document.getElementById('detailContent').value = item.content || '';
  document.getElementById('detailNotes').value = item.notes || '';
  document.getElementById('detailWords').value = item.words || 0;
  document.getElementById('detailDate').value = item.date || '';
  document.getElementById('detailEdition').value = item.edition || '';

  updatePaidToggle(item.paid);
  updateExcerptToggle(item.excerpt);

  document.getElementById('detailPanel').classList.add('open');
}

function updatePaidToggle(paid) {
  const toggle = document.getElementById('detailPaidToggle');
  const icon = document.getElementById('detailPaidIcon');
  const label = document.getElementById('detailPaidLabel');
  const desc = document.getElementById('detailPaidDesc');

  toggle.classList.toggle('active', paid);
  icon.textContent = paid ? '🔒' : '🔓';
  label.textContent = paid ? 'Paid' : 'Free';
  desc.textContent = paid ? 'Premium content - requires payment' : 'Available to all readers';
}

function updateExcerptToggle(excerpt) {
  const toggle = document.getElementById('detailExcerptToggle');
  const icon = document.getElementById('detailExcerptIcon');
  const label = document.getElementById('detailExcerptLabel');
  const desc = document.getElementById('detailExcerptDesc');

  toggle.classList.toggle('active', excerpt);
  icon.textContent = excerpt ? '⭐' : '📄';
  label.textContent = excerpt ? 'Excerpt' : 'Not an Excerpt';
  desc.textContent = excerpt ? 'Marked as potential excerpt' : 'Mark as potential excerpt';
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  currentDetailId = null;
}

function saveDetail() {
  if (!currentDetailId) return;

  const item = bookItems.find(i => i.id === currentDetailId);
  if (!item) return;

  saveState();

  item.title = document.getElementById('detailTitle').value.trim() || 'Untitled';
  item.content = document.getElementById('detailContent').value;
  item.notes = document.getElementById('detailNotes').value;
  item.words = parseInt(document.getElementById('detailWords').value) || 0;
  item.date = document.getElementById('detailDate').value;
  item.edition = document.getElementById('detailEdition').value;

  closeDetail();
  render();
}

function cutFromDetail() {
  if (!currentDetailId) return;

  const item = bookItems.find(i => i.id === currentDetailId);
  if (!item) return;

  saveState();

  // Move to floor
  bookItems = bookItems.filter(i => i.id !== currentDetailId);
  floorItems.push({
    id: item.id,
    title: item.title,
    category: 'save-later',
    words: item.words || 0,
    date: item.date,
    content: item.content,
    notes: item.notes,
    edition: item.edition,
    excerpt: item.excerpt
  });

  closeDetail();
  render();
  showToast('Moved to Cutting Room Floor');
}

// Event listeners for detail panel
document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('detailCancel').addEventListener('click', closeDetail);
document.getElementById('detailSave').addEventListener('click', saveDetail);
document.getElementById('detailCut').addEventListener('click', cutFromDetail);

document.getElementById('detailPaidToggle').addEventListener('click', () => {
  if (!currentDetailId) return;
  const item = bookItems.find(i => i.id === currentDetailId);
  if (item) {
    item.paid = !item.paid;
    updatePaidToggle(item.paid);
    document.getElementById('detailNumber').classList.toggle('paid', item.paid);
  }
});

document.getElementById('detailExcerptToggle').addEventListener('click', () => {
  if (!currentDetailId) return;
  const item = bookItems.find(i => i.id === currentDetailId);
  if (item) {
    item.excerpt = !item.excerpt;
    updateExcerptToggle(item.excerpt);
  }
});

document.getElementById('detailPanel').addEventListener('click', e => {
  if (e.target.id === 'detailPanel') closeDetail();
});

  const item = e.target.closest('[draggable="true"]');
  if (!item) return;

  dragData = {
    id: parseInt(item.dataset.id),
    source: item.dataset.source
  };

  item.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';

  requestAnimationFrame(() => {
    item.style.opacity = '0.4';
  });
});

document.addEventListener('dragend', e => {
  const item = e.target.closest('[draggable="true"]');
  if (item) {
    item.classList.remove('dragging');
    item.style.opacity = '';
  }

  document.querySelectorAll('.drag-over, .drag-target').forEach(el => {
    el.classList.remove('drag-over', 'drag-target');
  });

  dragData = null;
});

document.addEventListener('dragover', e => {
  e.preventDefault();

  const grid = document.getElementById('grid');
  const floorList = document.getElementById('floorList');

  if (grid.contains(e.target) || e.target === grid) {
    grid.classList.add('drag-target');
    floorList.classList.remove('drag-target');
  } else if (floorList.contains(e.target) || e.target === floorList) {
    floorList.classList.add('drag-target');
    grid.classList.remove('drag-target');
  }

  const item = e.target.closest('.box, .floor-item');
  if (item && parseInt(item.dataset.id) !== dragData?.id) {
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    item.classList.add('drag-over');
  }
});

document.addEventListener('dragleave', e => {
  const item = e.target.closest('.box, .floor-item');
  if (item) item.classList.remove('drag-over');
});

document.addEventListener('drop', e => {
  e.preventDefault();
  if (!dragData) return;

  const grid = document.getElementById('grid');
  const floorList = document.getElementById('floorList');

  const targetItem = e.target.closest('.box, .floor-item');
  const droppedOnGrid = grid.contains(e.target) || e.target === grid;
  const droppedOnFloor = floorList.contains(e.target) || e.target === floorList;

  saveState();

  // Moving within book
  if (dragData.source === 'book' && droppedOnGrid) {
    if (targetItem && targetItem.dataset.source === 'book') {
      const fromIdx = bookItems.findIndex(i => i.id === dragData.id);
      const toIdx = bookItems.findIndex(i => i.id === parseInt(targetItem.dataset.id));
      const [moved] = bookItems.splice(fromIdx, 1);
      bookItems.splice(toIdx, 0, moved);
    }
  }

  // Moving from book to floor
  else if (dragData.source === 'book' && droppedOnFloor) {
    const idx = bookItems.findIndex(i => i.id === dragData.id);
    const item = bookItems[idx];
    if (item && item.type === 'section') {
      bookItems.splice(idx, 1);
      floorItems.push({
        id: item.id,
        title: item.title,
        category: 'save-later',
        words: item.words || 0,
        date: item.date,
        content: item.content,
        notes: item.notes,
        edition: item.edition,
        excerpt: item.excerpt
      });
    }
  }

  // Moving from floor to book
  else if (dragData.source === 'floor' && droppedOnGrid) {
    const idx = floorItems.findIndex(i => i.id === dragData.id);
    const item = floorItems[idx];
    floorItems.splice(idx, 1);

    const newItem = {
      id: item.id,
      type: 'section',
      title: item.title,
      paid: false,
      words: item.words || 0,
      date: item.date,
      content: item.content,
      notes: item.notes,
      edition: item.edition,
      excerpt: item.excerpt
    };

    if (targetItem && targetItem.dataset.source === 'book') {
      const toIdx = bookItems.findIndex(i => i.id === parseInt(targetItem.dataset.id));
      bookItems.splice(toIdx, 0, newItem);
    } else {
      bookItems.push(newItem);
    }
  }

  // Reordering within floor
  else if (dragData.source === 'floor' && droppedOnFloor && targetItem) {
    const fromIdx = floorItems.findIndex(i => i.id === dragData.id);
    const toIdx = floorItems.findIndex(i => i.id === parseInt(targetItem.dataset.id));
    const [moved] = floorItems.splice(fromIdx, 1);
    floorItems.splice(toIdx, 0, moved);
  }

  document.querySelectorAll('.drag-over, .drag-target').forEach(el => {
    el.classList.remove('drag-over', 'drag-target');
  });

  render();
});

// ══════════════════════════════════════════════════════════
// CLICK HANDLERS
// ══════════════════════════════════════════════════════════

document.addEventListener('click', e => {
  const action = e.target.dataset.action;

  // Handle actions
  if (action) {
    const box = e.target.closest('.box, .floor-item');
    const id = box ? parseInt(box.dataset.id) : null;

    if (action === 'cut' && id) {
      e.stopPropagation();
      saveState();
      const idx = bookItems.findIndex(i => i.id === id);
      const item = bookItems[idx];
      if (item && item.type === 'section') {
        bookItems.splice(idx, 1);
        floorItems.push({
          id: item.id,
          title: item.title,
          category: 'save-later',
          words: item.words || 0,
          date: item.date,
          content: item.content,
          notes: item.notes,
          edition: item.edition,
          excerpt: item.excerpt
        });
        render();
        showToast('Moved to Cutting Room Floor');
      }
      return;
    }

    if (action === 'delete' && id) {
      e.stopPropagation();
      // Chapter breaks get deleted, sections go to floor
      const item = bookItems.find(i => i.id === id);
      if (item && item.type === 'break') {
        if (confirm('Delete this chapter break?')) {
          saveState();
          bookItems = bookItems.filter(i => i.id !== id);
          render();
        }
      }
      return;
    }

    if (action === 'delete-floor' && id) {
      e.stopPropagation();
      if (confirm('Permanently delete this item?')) {
        saveState();
        floorItems = floorItems.filter(i => i.id !== id);
        render();
      }
      return;
    }

    return;
  }

  // Click on box to open detail (both chapters and sections)
  const box = e.target.closest('.box');
  if (box && !e.target.closest('button')) {
    const id = parseInt(box.dataset.id);
    openDetail(id);
  }

  // Click on floor item to edit
  const floorItem = e.target.closest('.floor-item');
  if (floorItem && !e.target.closest('button')) {
    const id = parseInt(floorItem.dataset.id);
    const item = floorItems.find(i => i.id === id);
    if (item) {
      const newTitle = prompt('Edit title:', item.title);
      if (newTitle && newTitle.trim()) {
        saveState();
        item.title = newTitle.trim();
        render();
      }
    }
  }
});

// ══════════════════════════════════════════════════════════
// ADD MODAL
// ══════════════════════════════════════════════════════════

let modalMode = null;

document.getElementById('addSectionBtn').addEventListener('click', () => {
  modalMode = 'section';
  document.getElementById('modalTitle').textContent = 'Add Section';
  document.getElementById('categoryField').style.display = 'none';
  document.getElementById('editionField').style.display = 'block';
  document.getElementById('wordsDateRow').style.display = 'flex';
  document.getElementById('contentField').style.display = 'block';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputContent').value = '';
  document.getElementById('inputEdition').value = '';
  document.getElementById('inputWords').value = '';
  document.getElementById('inputDate').value = '';
  document.getElementById('modal').classList.add('open');
  document.getElementById('inputTitle').focus();
});

document.getElementById('addBreakBtn').addEventListener('click', () => {
  modalMode = 'break';
  document.getElementById('modalTitle').textContent = 'Add Chapter Break';
  document.getElementById('categoryField').style.display = 'none';
  document.getElementById('editionField').style.display = 'none';
  document.getElementById('wordsDateRow').style.display = 'none';
  document.getElementById('contentField').style.display = 'none';
  document.getElementById('inputTitle').value = '';
  document.getElementById('modal').classList.add('open');
  document.getElementById('inputTitle').focus();
});

document.getElementById('addFloorBtn').addEventListener('click', () => {
  modalMode = 'floor';
  document.getElementById('modalTitle').textContent = 'Add to Cutting Room Floor';
  document.getElementById('categoryField').style.display = 'block';
  document.getElementById('editionField').style.display = 'block';
  document.getElementById('wordsDateRow').style.display = 'flex';
  document.getElementById('contentField').style.display = 'block';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputContent').value = '';
  document.getElementById('inputEdition').value = '';
  document.getElementById('inputWords').value = '';
  document.getElementById('inputDate').value = '';
  document.getElementById('modal').classList.add('open');
  document.getElementById('inputTitle').focus();
});

document.getElementById('modalCancel').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});

document.getElementById('modalSave').addEventListener('click', () => {
  const title = document.getElementById('inputTitle').value.trim();
  if (!title) return alert('Enter a title');

  saveState();

  const maxId = Math.max(
    ...bookItems.map(i => i.id),
    ...floorItems.map(i => i.id),
    0
  ) + 1;

  const content = document.getElementById('inputContent')?.value || '';
  const edition = document.getElementById('inputEdition')?.value || '';
  const date = document.getElementById('inputDate')?.value || '';
  const manualWords = parseInt(document.getElementById('inputWords')?.value) || 0;
  const words = manualWords || content.split(/\s+/).filter(w => w).length;

  if (modalMode === 'section') {
    bookItems.push({ id: maxId, type: 'section', title, paid: false, words, date, content, edition });
  } else if (modalMode === 'break') {
    bookItems.push({ id: maxId, type: 'break', title });
  } else if (modalMode === 'floor') {
    const category = document.getElementById('inputCategory').value;
    floorItems.push({ id: maxId, title, category, words, date, content, edition });
  }

  document.getElementById('modal').classList.remove('open');
  render();
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') {
    document.getElementById('modal').classList.remove('open');
  }
});

// ══════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════════════════════════════

document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    if (hasChanges) saveData();
  }

  if (e.ctrlKey && e.key === 'z') {
    e.preventDefault();
    undo();
  }

  if (e.key === 'Escape') {
    document.getElementById('modal').classList.remove('open');
    closeDetail();
  }
});

// ══════════════════════════════════════════════════════════
// FILTER & BUTTONS
// ══════════════════════════════════════════════════════════

document.getElementById('floorFilter').addEventListener('change', renderFloor);
document.getElementById('saveBtn').addEventListener('click', saveData);
document.getElementById('undoBtn').addEventListener('click', undo);

// ══════════════════════════════════════════════════════════
// WARN BEFORE LEAVING
// ══════════════════════════════════════════════════════════

window.onbeforeunload = () => hasChanges ? true : null;

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

loadData();
</script>
