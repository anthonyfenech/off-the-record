<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#333333">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Library - OFF-THE-RECORD">
    <meta property="og:image" content="https://anthonyfenech.github.io/off-the-record/assets/icons/icon-512.png">
    <meta property="og:url" content="https://anthonyfenech.github.io/off-the-record/library.html">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Library - OFF-THE-RECORD">
    <meta name="twitter:image" content="https://anthonyfenech.github.io/off-the-record/assets/icons/icon-512.png">

    <title>Library - OFF-THE-RECORD</title>

    <!-- CRITICAL: Apply theme BEFORE CSS loads to prevent FOUC -->
    <script>
        (function() {
            if (localStorage.getItem('reader_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Critical: Hide sidebar before CSS loads to prevent flash -->
    <style>.toc-sidebar{visibility:hidden;transform:translateX(-100%)}.overlay{visibility:hidden;opacity:0}</style>

    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">

    <!-- Preload critical fonts -->
    <link rel="preload" href="./fonts/literata-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/literata-italic.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Preload critical CSS -->
    <link rel="preload" href="./css/variables.min.css?v=401" as="style">
    <link rel="preload" href="./css/typography.min.css?v=401" as="style">

    <!-- Self-hosted fonts (no external request) -->
    <link rel="stylesheet" href="./css/fonts.min.css?v=401">

    <link rel="stylesheet" href="./css/reset.min.css?v=401">
    <link rel="stylesheet" href="./css/variables.min.css?v=401">
    <link rel="stylesheet" href="./css/typography.min.css?v=401">
    <link rel="stylesheet" href="./css/layout.min.css?v=401">
    <link rel="stylesheet" href="./css/components.min.css?v=429">
    <link rel="stylesheet" href="./css/otr-tier1-states.css?v=401">

    <style>
        body {
            padding: 90px 20px 40px;
        }

        /* Sticky header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--color-header-bg);
            border-bottom: 1px solid var(--color-border);
            will-change: transform;
            backface-visibility: hidden;
            transition: background-color var(--transition-fast);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 69px;
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-logo-img {
            height: 28px;
            width: auto;
        }

        /* Library Content */
        .library-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 0;
        }

        .library-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .library-title {
            font-family: var(--font-body);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text);
        }

        .library-subtitle {
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            font-style: italic;
        }

        .library-count {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-top: 16px;
            letter-spacing: 0.05em;
        }

        /* Search Form */
        .library-search {
            margin-bottom: 40px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            font-family: var(--font-body);
            border: 1.5px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            border-radius: 0;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-text);
        }

        .search-input::placeholder {
            color: var(--color-text-secondary);
        }

        .search-button {
            padding: 14px 28px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-bg);
            background: var(--color-text);
            border: 1.5px solid var(--color-text);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .search-button:hover {
            opacity: 0.8;
        }

        /* Results */
        .library-results {
            display: none;
        }

        .library-results.visible {
            display: block;
        }

        .results-count {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--color-border);
        }

        .result-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--color-border);
        }

        .result-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-title a {
            color: #0000EE;
            text-decoration: underline;
        }

        .result-title a:hover {
            color: #551A8B;
        }

        [data-theme="dark"] .result-title a {
            color: #6B9FFF;
        }

        [data-theme="dark"] .result-title a:hover {
            color: #99BBFF;
        }

        .result-dataset {
            color: var(--color-text-secondary);
            font-size: 0.85rem;
        }

        .result-preview {
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--color-text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .highlight {
            background-color: #FFFF00;
            color: #000;
            padding: 0 2px;
        }

        [data-theme="dark"] .highlight {
            background-color: #665500;
            color: #fff;
        }

        /* Pagination */
        .library-pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
            padding-top: 20px;
        }

        .page-link {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            color: var(--color-text);
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
        }

        .page-link:hover {
            opacity: 0.7;
        }

        .page-link.active {
            text-decoration: none;
            cursor: default;
        }

        @media (max-width: 599px) {
            body {
                padding: 74px 16px 40px;
            }

            .search-form {
                flex-direction: column;
            }

            .search-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <script>
        // Apply theme
        if (localStorage.getItem('reader_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <!-- Header Navigation -->
    <header class="header" id="header">
        <div class="header-content">
            <button class="menu-btn" id="menuBtn" aria-label="Open menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a href="./" class="header-logo"><img src="./assets/icons/OTR-header.png" alt="OFF-THE-RECORD" class="header-logo-img"></a>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="library-container">
        <div class="library-header">
            <h1 class="library-title">Search Full Fenech Library</h1>
            <p class="library-subtitle">Documents from 15 years on the Detroit Tigers beat</p>
            <p class="library-count" id="libraryCount"></p>
        </div>

        <div class="library-search">
            <form class="search-form" id="librarySearchForm" onsubmit="return false;">
                <input type="text" class="search-input" id="librarySearchInput" placeholder="Search documents, names, topics..." autocomplete="off">
                <button type="submit" class="search-button" id="librarySearchBtn">Search</button>
            </form>
        </div>

        <div class="library-results" id="libraryResults">
            <p class="results-count">Showing <span id="resultsStart">1</span> to <span id="resultsEnd">10</span> of <span id="resultsTotal">0</span> Results.</p>

            <div id="resultsList">
                <!-- Results populated by JS -->
            </div>

            <div class="library-pagination" id="libraryPagination">
                <!-- Pagination populated by JS -->
            </div>
        </div>
    </main>

    <!-- Table of Contents Sidebar -->
    <aside class="toc-sidebar" id="tocSidebar">
        <div class="toc-header">
            <button class="close-btn" id="closeTocBtn" aria-label="Close menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <nav class="toc-content" id="tocContent">
            <!-- Populated by JavaScript -->
        </nav>
        <!-- Options Section -->
        <div class="toc-section" id="optionsSection">
            <button class="toc-section-header" id="optionsToggle" aria-expanded="false">
                <span class="toc-section-title">Options</span>
                <svg class="toc-section-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="toc-section-content" id="optionsContent" style="display: none;">
                <div class="toc-option">
                    <span class="toc-option-label">Theme</span>
                    <div class="option-btn-group" id="themeToggleGroup">
                        <button class="option-btn" data-theme="light">Light</button>
                        <button class="option-btn" data-theme="dark">Dark</button>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Overlay for TOC -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar Navigation -->
    <script type="module">
        import { CHAPTERS, getChaptersByYear, getIntroChapters, getPostscriptChapters, getSortedYears } from './data/chapters.js';

        // DOM elements
        const menuBtn = document.getElementById('menuBtn');
        const closeTocBtn = document.getElementById('closeTocBtn');
        const tocSidebar = document.getElementById('tocSidebar');
        const overlay = document.getElementById('overlay');
        const tocContent = document.getElementById('tocContent');
        const themeToggle = document.getElementById('themeToggle');
        const optionsToggle = document.getElementById('optionsToggle');
        const optionsContent = document.getElementById('optionsContent');

        // Build TOC
        buildTOC();

        // Sidebar open/close
        function openTOC() {
            tocSidebar.style.visibility = 'visible';
            tocSidebar.style.transform = '';
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '';
            tocSidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeTOC() {
            tocSidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (!tocSidebar.classList.contains('open')) {
                    tocSidebar.style.visibility = 'hidden';
                    overlay.style.visibility = 'hidden';
                }
            }, 310);
        }

        menuBtn.addEventListener('click', openTOC);
        closeTocBtn.addEventListener('click', closeTOC);
        overlay.addEventListener('click', closeTOC);

        // Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && tocSidebar.classList.contains('open')) {
                closeTOC();
            }
        });

        // Theme toggle
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('reader_theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('reader_theme', 'dark');
            }
        });

        // Options toggle
        optionsToggle.addEventListener('click', () => {
            const isExpanded = optionsToggle.getAttribute('aria-expanded') === 'true';
            optionsToggle.setAttribute('aria-expanded', !isExpanded);
            optionsContent.style.display = isExpanded ? 'none' : 'block';
        });

        // Build TOC structure
        function buildTOC() {
            const fragment = document.createDocumentFragment();

            // BOOK section
            fragment.appendChild(createBookSection());

            // BINGE MODE link
            fragment.appendChild(createNavLink('BINGE MODE', './binge-mode.html', false));

            // LIBRARY link (current page)
            fragment.appendChild(createNavLink('LIBRARY', './library.html', true));

            // Divider
            const divider = document.createElement('div');
            divider.className = 'toc-divider';
            fragment.appendChild(divider);

            tocContent.appendChild(fragment);
        }

        // Create nav link
        function createNavLink(label, url, isCurrent) {
            const section = document.createElement('div');
            section.className = 'toc-top-section';

            const link = document.createElement('a');
            link.href = url;
            link.className = 'toc-top-header';
            link.style.textDecoration = 'none';
            if (isCurrent) {
                link.style.fontWeight = 'bold';
            }

            const title = document.createElement('h3');
            title.className = 'toc-top-title';
            title.textContent = label;

            const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            arrow.setAttribute('class', 'toc-section-arrow');
            arrow.setAttribute('width', '12');
            arrow.setAttribute('height', '12');
            arrow.setAttribute('viewBox', '0 0 24 24');
            arrow.setAttribute('fill', 'none');
            arrow.setAttribute('stroke', 'currentColor');
            arrow.setAttribute('stroke-width', '2');
            arrow.innerHTML = '<polyline points="9 6 15 12 9 18"></polyline>';

            link.appendChild(title);
            link.appendChild(arrow);
            section.appendChild(link);

            return section;
        }

        // Create BOOK section with chapters
        function createBookSection() {
            const section = document.createElement('div');
            section.className = 'toc-top-section';
            section.dataset.section = 'book';

            const sectionHeader = document.createElement('div');
            sectionHeader.className = 'toc-top-header';
            sectionHeader.style.cursor = 'pointer';

            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'toc-top-title';
            sectionTitle.textContent = 'OFF-THE-RECORD';

            sectionHeader.appendChild(sectionTitle);

            const bookContent = document.createElement('div');
            bookContent.className = 'toc-book-content collapsed';
            bookContent.id = 'toc-book-content';

            // Build chapter list
            buildBookContent(bookContent);

            sectionHeader.addEventListener('click', () => {
                bookContent.classList.toggle('collapsed');
            });

            section.appendChild(sectionHeader);
            section.appendChild(bookContent);

            return section;
        }

        // Build chapter items
        function buildBookContent(container) {
            const introChapters = getIntroChapters();
            const chaptersByYear = getChaptersByYear();
            const postscriptChapters = getPostscriptChapters();
            const years = getSortedYears();

            // Intro chapters
            introChapters.forEach(ch => {
                container.appendChild(createChapterLink(ch));
            });

            // Year chapters
            years.forEach(year => {
                const yearChapters = chaptersByYear[year] || [];
                yearChapters.forEach(ch => {
                    container.appendChild(createChapterLink(ch));
                });
            });

            // Postscript
            postscriptChapters.forEach(ch => {
                container.appendChild(createChapterLink(ch));
            });
        }

        function createChapterLink(chapter) {
            const link = document.createElement('a');
            link.href = `./?chapter=${chapter.id}`;
            link.className = 'toc-chapter-link';
            link.textContent = chapter.navTitle || chapter.title;
            return link;
        }
    </script>

    <!-- Library Search -->
    <script>
    (function() {
        let libraryData = [];
        let currentResults = [];
        let currentPage = 1;
        const resultsPerPage = 10;

        // DOM elements
        const searchInput = document.getElementById('librarySearchInput');
        const searchBtn = document.getElementById('librarySearchBtn');
        const resultsSection = document.getElementById('libraryResults');
        const resultsList = document.getElementById('resultsList');
        const pagination = document.getElementById('libraryPagination');
        const resultsStart = document.getElementById('resultsStart');
        const resultsEnd = document.getElementById('resultsEnd');
        const resultsTotal = document.getElementById('resultsTotal');
        const libraryCount = document.getElementById('libraryCount');

        // Load library data
        fetch('./library-data.json')
            .then(res => res.json())
            .then(data => {
                libraryData = data;
                libraryCount.textContent = data.length.toLocaleString() + ' DOCUMENTS IN THE LIBRARY';
            })
            .catch(err => {
                console.error('Failed to load library data:', err);
                libraryCount.textContent = 'Error loading library';
            });

        // Search handler
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) return;

            currentResults = libraryData.filter(record => {
                const titleMatch = record.title.toLowerCase().includes(query);
                const textMatch = record.text.toLowerCase().includes(query);
                return titleMatch || textMatch;
            });

            currentPage = 1;
            displayResults(query);
        }

        // Display results
        function displayResults(query) {
            const total = currentResults.length;
            const start = (currentPage - 1) * resultsPerPage;
            const end = Math.min(start + resultsPerPage, total);
            const pageResults = currentResults.slice(start, end);

            resultsStart.textContent = total > 0 ? start + 1 : 0;
            resultsEnd.textContent = end;
            resultsTotal.textContent = total.toLocaleString();

            resultsList.innerHTML = '';

            if (total === 0) {
                resultsList.innerHTML = '<p style="color: var(--color-text-secondary); padding: 20px 0;">No results found.</p>';
            } else {
                pageResults.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'result-item';

                    const title = document.createElement('p');
                    title.className = 'result-title';
                    const titleLink = document.createElement('a');
                    titleLink.href = record.url || '#';
                    titleLink.textContent = record.title;
                    title.appendChild(titleLink);

                    const meta = document.createElement('span');
                    meta.className = 'result-dataset';
                    meta.textContent = ' - ' + record.dataset + ' - ' + formatDate(record.date);
                    title.appendChild(meta);

                    const preview = document.createElement('p');
                    preview.className = 'result-preview';
                    preview.innerHTML = highlightText(record.text, query);

                    item.appendChild(title);
                    item.appendChild(preview);
                    resultsList.appendChild(item);
                });
            }

            renderPagination(total);
            resultsSection.classList.add('visible');
        }

        // Highlight search term
        function highlightText(text, query) {
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp('(' + escaped + ')', 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // Render pagination
        function renderPagination(total) {
            pagination.innerHTML = '';
            const totalPages = Math.ceil(total / resultsPerPage);
            if (totalPages <= 1) return;

            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            // First page
            if (startPage > 1) {
                pagination.appendChild(createPageBtn(1));
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.color = 'var(--color-text-secondary)';
                    pagination.appendChild(ellipsis);
                }
            }

            // Page numbers
            for (let i = startPage; i <= endPage; i++) {
                pagination.appendChild(createPageBtn(i));
            }

            // Last page
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.color = 'var(--color-text-secondary)';
                    pagination.appendChild(ellipsis);
                }
                pagination.appendChild(createPageBtn(totalPages));
            }
        }

        function createPageBtn(page) {
            const btn = document.createElement('button');
            btn.className = 'page-link' + (page === currentPage ? ' active' : '');
            btn.textContent = page;
            btn.addEventListener('click', () => {
                if (page !== currentPage) {
                    currentPage = page;
                    displayResults(searchInput.value.trim().toLowerCase());
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            return btn;
        }

        // Event listeners
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });
    })();
    </script>
</body>
</html>
