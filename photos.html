<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Photo galleries - OFF-THE-RECORD">
    <meta name="theme-color" content="#333333">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OFF-THE-RECORD">

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://*.googleapis.com; media-src 'self' blob:; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Photos - OFF-THE-RECORD</title>

    <!-- CRITICAL: Apply theme BEFORE CSS loads to prevent FOUC -->
    <script>
        (function() {
            if (localStorage.getItem('reader_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">

    <!-- Preload critical fonts -->
    <link rel="preload" href="./fonts/literata-regular.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Self-hosted fonts (no external request) -->
    <link rel="stylesheet" href="./css/fonts.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/reset.min.css">
    <link rel="stylesheet" href="./css/variables.min.css">
    <link rel="stylesheet" href="./css/typography.css">
    <link rel="stylesheet" href="./css/layout.min.css">
    <link rel="stylesheet" href="./css/components.min.css">
    <link rel="stylesheet" href="./css/otr-tier1-states.css">
</head>
<body style="opacity: 0;">
    <script>
        // Auth check - must run synchronously before content renders
        (function() {
            if (localStorage.getItem('otr_beta_access') !== 'true') {
                window.location.replace('./');
                return;
            }
            document.body.style.opacity = '1';
        })();
    </script>
    <!-- Header Navigation -->
    <header class="header" id="header">
        <div class="header-content">
            <a href="./" class="back-link" aria-label="Back to book">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <a href="./" class="header-logo"><img src="./assets/icons/OTR-header.png" alt="OFF-THE-RECORD" class="header-logo-img"></a>
            <div style="width: 44px;"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="reader" id="reader">
        <article class="chapter">
            <header class="chapter-header">
                <h2 class="chapter-title">PHOTOS</h2>
            </header>
            <div class="photos-page" id="photosContainer">
                <!-- Photo galleries rendered by JS -->
            </div>
        </article>
    </main>

    <!-- Scripts -->
    <script type="module">
        import { getAllGalleries } from './data/photos.js';
        import { photoGallery } from './js/photoGallery.min.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize photo gallery modal
            photoGallery.init();

            const container = document.getElementById('photosContainer');
            const galleries = getAllGalleries();

            galleries.forEach(gallery => {
                // Create gallery section
                const section = document.createElement('section');
                section.className = 'gallery-page-section';
                section.id = `gallery-${gallery.id}`;

                // Gallery header
                const header = document.createElement('div');
                header.className = 'gallery-page-header';

                const title = document.createElement('h3');
                title.className = 'gallery-page-title';
                title.textContent = gallery.title.toUpperCase();

                header.appendChild(title);
                section.appendChild(header);

                if (gallery.comingSoon) {
                    // Show coming soon message
                    const comingSoon = document.createElement('div');
                    comingSoon.className = 'gallery-coming-soon';
                    comingSoon.textContent = 'Coming Soon';
                    section.appendChild(comingSoon);
                } else {
                    // Render photo grid
                    const gridContainer = document.createElement('div');
                    gridContainer.id = `photos-${gallery.id}`;
                    section.appendChild(gridContainer);

                    // Use photoGallery to render the grid
                    setTimeout(() => {
                        photoGallery.renderGalleryGrid(gallery.id, `photos-${gallery.id}`);
                    }, 0);
                }

                container.appendChild(section);
            });
        });
    </script>
    <script src="./js/otr-tier1-error-handler.js"></script>
</body>
</html>
