    <!-- FAILSAFE: URL kill switch — add ?reset=true to URL to nuke all overlays -->
    <script>
    (function(){
        if(window.location.search.indexOf('reset=true')===-1)return;
        var s=document.createElement('style');
        s.textContent='*{pointer-events:auto!important}.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]{display:none!important;pointer-events:none!important;visibility:hidden!important;opacity:0!important;z-index:-1!important}body{overflow:auto!important;pointer-events:auto!important}';
        document.head.appendChild(s);
        document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.active').forEach(function(el){el.classList.remove('active')});
            document.querySelectorAll('.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]').forEach(function(el){
                el.style.cssText='display:none!important;pointer-events:none!important;visibility:hidden!important;opacity:0!important;z-index:-1!important';
            });
            document.body.style.overflow='auto';
            document.body.style.pointerEvents='auto';
            document.body.classList.remove('sidebar-open','modal-open','no-scroll','home-page');
            console.log('NUCLEAR RESET TRIGGERED — all overlays destroyed. Remove ?reset=true from URL to restore normal behavior.');
        });
    })();
    </script>

    <!-- Emergency overlay cleanup -->
    <script>
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                var overlays = document.querySelectorAll('.overlay, .lightbox-overlay, .prompt-overlay, [class*="overlay"]');
                overlays.forEach(function(el) {
                    el.classList.remove('active');
                    el.style.pointerEvents = 'none';
                    el.style.visibility = 'hidden';
                });
                document.body.style.overflow = '';
            });
        })();
    </script>

    <script type="module">
        // ═══════════════════════════════════════════════════════════════
        // GO OFF - OTR FILES DOCUMENT SEARCH
        // ═══════════════════════════════════════════════════════════════

        const PER_PAGE = 25;
        const OTR_FILES_BASE = `${window.location.origin}/otr-files`;
        const DOCUMENTS_URL = `${OTR_FILES_BASE}/js/documents.js`;

        let documents = [];
        let index = {};
        let results = [];
        let currentPage = 1;
        let currentQuery = '';

        // ─────────────────────────────────────────────────────────────────
        // STEP 1: Load Documents
        // ─────────────────────────────────────────────────────────────────
        async function loadDocuments() {
            try {
                const module = await import(`${DOCUMENTS_URL}?t=${Date.now()}`);
                if (module.OTR_DOCUMENTS && Array.isArray(module.OTR_DOCUMENTS)) {
                    documents = module.OTR_DOCUMENTS;
                    console.log('[Go Off] Loaded', documents.length, 'documents');
                    buildIndex();
                    checkUrlParams();
                }
            } catch (e) {
                console.error('[Go Off] Failed to load documents:', e);
            }
        }

        // ─────────────────────────────────────────────────────────────────
        // STEP 2: Build Inverted Index
        // ─────────────────────────────────────────────────────────────────
        function tokenize(text) {
            if (!text) return [];
            return text.toLowerCase()
                .replace(/[^\w\s]/g, ' ')
                .split(/\s+/)
                .filter(t => t.length > 1);
        }

        function buildIndex() {
            index = {};
            documents.forEach((doc, docIndex) => {
                const fields = [
                    doc.title || '',
                    doc.from || '',
                    doc.to || '',
                    doc.searchText || '',
                    doc.content || '',
                    doc.contextNote || '',
                    doc.id || '',
                    doc.slug || '',
                    (doc.subjects || []).join(' '),
                    (doc.tags || []).join(' '),
                    (doc.participants || []).join(' ')
                ];

                const allText = fields.join(' ');
                const tokens = tokenize(allText);

                tokens.forEach(token => {
                    if (!index[token]) {
                        index[token] = new Set();
                    }
                    index[token].add(docIndex);
                });
            });

            console.log('[Go Off] Index built with', Object.keys(index).length, 'unique tokens');
        }

        // ─────────────────────────────────────────────────────────────────
        // STEP 3: Perform Search with Scoring
        // ─────────────────────────────────────────────────────────────────
        function performSearch(query) {
            currentQuery = query.trim().toLowerCase();
            if (!currentQuery) {
                results = [];
                return;
            }

            const queryTokens = tokenize(currentQuery);
            if (queryTokens.length === 0) {
                results = [];
                return;
            }

            // Find candidate documents (intersection of all query tokens)
            let candidateIndices = null;
            for (const token of queryTokens) {
                const matches = index[token];
                if (!matches) {
                    candidateIndices = new Set();
                    break;
                }
                if (candidateIndices === null) {
                    candidateIndices = new Set(matches);
                } else {
                    candidateIndices = new Set([...candidateIndices].filter(i => matches.has(i)));
                }
            }

            if (!candidateIndices || candidateIndices.size === 0) {
                results = [];
                return;
            }

            // Score each candidate
            const scored = [];
            const queryLower = currentQuery;

            candidateIndices.forEach(docIndex => {
                const doc = documents[docIndex];
                let score = 0;

                // Title match: +10
                if (doc.title && doc.title.toLowerCase().includes(queryLower)) {
                    score += 10;
                }

                // Subject match: +5 each
                if (doc.subjects) {
                    doc.subjects.forEach(s => {
                        if (s.toLowerCase().includes(queryLower)) score += 5;
                    });
                }

                // Tag match: +3 each
                if (doc.tags) {
                    doc.tags.forEach(t => {
                        if (t.toLowerCase().includes(queryLower)) score += 3;
                    });
                }

                // From/To match: +5 each
                if (doc.from && doc.from.toLowerCase().includes(queryLower)) score += 5;
                if (doc.to && doc.to.toLowerCase().includes(queryLower)) score += 5;

                // Participants match: +3 each
                if (doc.participants) {
                    doc.participants.forEach(p => {
                        if (p.toLowerCase().includes(queryLower)) score += 3;
                    });
                }

                // SearchText/content match: +1
                const textContent = (doc.searchText || doc.content || '').toLowerCase();
                if (textContent.includes(queryLower)) score += 1;

                // Featured bonus: +2
                if (doc.featured) score += 2;

                // ID exact match bonus: +15
                if (doc.id && doc.id.toLowerCase() === queryLower) score += 15;

                scored.push({ doc, docIndex, score });
            });

            // Sort by score descending, then by date descending
            scored.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                // Secondary sort by date
                const dateA = a.doc.date || '';
                const dateB = b.doc.date || '';
                return dateB.localeCompare(dateA);
            });

            results = scored.map(s => s.doc);
        }

        // ─────────────────────────────────────────────────────────────────
        // STEP 4: Generate Snippet with Highlighting
        // ─────────────────────────────────────────────────────────────────
        function generateSnippet(doc, maxLength = 200) {
            const text = doc.searchText || doc.content || doc.contextNote || '';
            if (!text || !currentQuery) return '';

            const queryLower = currentQuery.toLowerCase();
            const textLower = text.toLowerCase();
            const pos = textLower.indexOf(queryLower);

            let snippet;
            if (pos === -1) {
                // Query not found in text, use beginning
                snippet = text.substring(0, maxLength);
            } else {
                // Center around match
                const start = Math.max(0, pos - 50);
                const end = Math.min(text.length, pos + maxLength - 50);
                snippet = (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');
            }

            // Highlight query terms
            const escaped = currentQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return snippet.replace(regex, '<mark>$1</mark>');
        }

        // ─────────────────────────────────────────────────────────────────
        // STEP 5: Render Results
        // ─────────────────────────────────────────────────────────────────
        function getClassificationClass(classification) {
            if (!classification) return '';
            const c = classification.toLowerCase().replace(/\s+/g, '-');
            if (c.includes('unredacted')) return 'unredacted';
            if (c.includes('partially')) return 'partially-redacted';
            if (c.includes('heavily')) return 'heavily-redacted';
            if (c.includes('classified')) return 'classified';
            return '';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function renderResults() {
            const resultsEl = document.getElementById('results');
            const listEl = document.getElementById('resultsList');
            const pagEl = document.getElementById('pagination');
            const infoEl = document.getElementById('resultsInfo');

            if (results.length === 0) {
                resultsEl.classList.add('visible');
                infoEl.textContent = currentQuery ? 'No documents found.' : '';
                listEl.innerHTML = '';
                pagEl.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * PER_PAGE;
            const end = Math.min(start + PER_PAGE, results.length);
            const totalPages = Math.ceil(results.length / PER_PAGE);

            infoEl.textContent = `Showing ${start + 1} to ${end} of ${results.length} results`;

            listEl.innerHTML = results.slice(start, end).map(doc => {
                const type = doc.type || 'document';
                const typeLabel = type.charAt(0).toUpperCase() + type.slice(1);
                const date = formatDate(doc.date);
                const classification = doc.classification || '';
                const classClass = getClassificationClass(classification);
                const title = doc.title || doc.id || 'Untitled';
                const id = doc.id || '';
                const from = doc.from || '';
                const to = doc.to || '';
                const snippet = generateSnippet(doc);

                let participantsHtml = '';
                if (from || to) {
                    const parts = [];
                    if (from) parts.push(`From: ${from}`);
                    if (to) parts.push(`To: ${to}`);
                    participantsHtml = `<div class="result-participants">${parts.join(' &bull; ')}</div>`;
                }

                return `
                <div class="result-card">
                    <div class="result-header">
                        <div class="result-meta-left">
                            <span class="result-type">${typeLabel}</span>
                            ${date ? `<span class="result-date">${date}</span>` : ''}
                        </div>
                        ${classification ? `<span class="result-classification ${classClass}">${classification}</span>` : ''}
                    </div>
                    <div class="result-title">${title}</div>
                    <div class="result-id">${id}</div>
                    ${participantsHtml}
                    ${snippet ? `<div class="result-snippet">${snippet}</div>` : ''}
                    <a href="${OTR_FILES_BASE}/document.html?id=${encodeURIComponent(id)}" target="_blank" rel="noopener" class="result-link">View Document &rarr;</a>
                </div>
            `}).join('');

            // Render pagination
            if (totalPages > 1) {
                let pagHtml = '';
                for (let i = 1; i <= totalPages; i++) {
                    pagHtml += `<button class="page-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
                }
                pagEl.innerHTML = pagHtml;

                pagEl.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentPage = parseInt(btn.dataset.page);
                        renderResults();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                });
            } else {
                pagEl.innerHTML = '';
            }

            resultsEl.classList.add('visible');
        }

        // ─────────────────────────────────────────────────────────────────
        // STEP 6: Handle Search
        // ─────────────────────────────────────────────────────────────────
        function handleSearch(query) {
            currentPage = 1;
            performSearch(query);
            renderResults();

            // Update URL
            const url = new URL(window.location);
            if (query.trim()) {
                url.searchParams.set('q', query.trim());
            } else {
                url.searchParams.delete('q');
            }
            history.replaceState(null, '', url);
        }

        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                document.getElementById('searchInput').value = q;
                handleSearch(q);
            }
        }

        // ─────────────────────────────────────────────────────────────────
        // INITIALIZATION
        // ─────────────────────────────────────────────────────────────────
        document.getElementById('searchButton').addEventListener('click', () => {
            handleSearch(document.getElementById('searchInput').value);
        });

        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSearch(e.target.value);
            }
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
            localStorage.setItem('reader_theme', dark ? 'light' : 'dark');
        });

        // Load documents on page load
        loadDocuments();

        // ─────────────────────────────────────────────────────────────────
        // SIDEBAR NAVIGATION
        // ─────────────────────────────────────────────────────────────────
        const menuBtn = document.getElementById('menuBtn');
        const closeTocBtn = document.getElementById('closeTocBtn');
        const tocSidebar = document.getElementById('tocSidebar');
        const overlay = document.getElementById('overlay');

        function openSidebar() {
            tocSidebar.classList.add('open');
            overlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            tocSidebar.classList.remove('open');
            overlay.classList.remove('visible');
            document.body.style.overflow = '';
        }

        menuBtn.addEventListener('click', openSidebar);
        closeTocBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);
    </script>
