<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#333333">

    <meta property="og:title" content="Go Off - OFF-THE-RECORD">
    <meta property="og:url" content="https://anthonyfenech.github.io/off-the-record/go-off.html">
    <meta name="twitter:title" content="Go Off - OFF-THE-RECORD">

    <title>Go Off - OFF-THE-RECORD</title>

    <script>
        if (localStorage.getItem('reader_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">
    <link rel="stylesheet" href="./css/fonts.min.css?v=391">
    <link rel="stylesheet" href="./css/reset.min.css?v=391">
    <link rel="stylesheet" href="./css/variables.min.css?v=391">
    <link rel="stylesheet" href="./css/typography.min.css?v=391">
    <link rel="stylesheet" href="./css/layout.min.css?v=391">
    <link rel="stylesheet" href="./css/components.min.css?v=391">

    <style>
        /* Search form - full width of reading column */
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 2em;
        }
        .search-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            font-family: var(--font-body);
            border: 1px solid var(--color-border);
            background: var(--color-background);
            color: var(--color-text-primary);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--color-text-primary);
        }
        .search-btn {
            padding: 12px 24px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: var(--color-text-primary);
            color: var(--color-background);
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .search-btn:hover { opacity: 0.8; }

        /* Intro text */
        .chapter-intro {
            color: var(--color-text-secondary);
            font-style: italic;
            margin-bottom: 2em;
        }
        .doc-count {
            font-family: var(--font-mono);
            font-size: 0.85em;
        }

        /* Results */
        .results { display: none; }
        .results.visible { display: block; }
        .results-info {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-bottom: 1.5em;
            padding-bottom: 1em;
            border-bottom: 1px solid var(--color-border);
        }
        .result {
            margin-bottom: 1.5rem;
        }
        .result-title {
            line-height: 1.4;
            margin-bottom: 0.3em;
        }
        .result-title a {
            color: var(--color-link);
            font-weight: 700;
            text-decoration: none;
        }
        .result-title a:hover { text-decoration: underline; }
        .result-type {
            color: var(--color-text-secondary);
            font-weight: 400;
        }
        .result-snippet {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--color-text-primary);
        }
        .result-snippet strong {
            font-weight: 700;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 2em;
        }
        .page-btn {
            font-family: var(--font-mono);
            font-size: 14px;
            padding: 6px 12px;
            background: none;
            border: none;
            color: var(--color-link);
            cursor: pointer;
            text-decoration: underline;
        }
        .page-btn:hover { opacity: 0.7; }
        .page-btn.active {
            color: var(--color-text-primary);
            text-decoration: none;
            cursor: default;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .search-form { flex-direction: column; }
            .search-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <script>
        localStorage.setItem('otr_beta_session', JSON.stringify({ authenticated: true, expires: Date.now() + 365*24*60*60*1000 }));
    </script>

    <!-- Header Navigation -->
    <header class="header" id="header">
        <div class="header-content">
            <button class="menu-btn" id="menuBtn" aria-label="Open menu" style="visibility: hidden;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a href="./" class="header-logo"><img src="./assets/icons/OTR-header.png" alt="OFF-THE-RECORD" class="header-logo-img"></a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Reading Area -->
    <main class="reader" id="reader">
        <article class="chapter" id="chapterContent">
            <header class="chapter-header">
                <h2 class="chapter-title">Go Off</h2>
            </header>
            <div class="chapter-body" id="chapterBody">
                <p class="chapter-intro">Search the OTR Files document archive. <span class="doc-count" id="docCount"></span></p>

                <form class="search-form" onsubmit="return false;">
                    <input type="text" class="search-input" id="searchInput" autocomplete="off">
                    <button type="submit" class="search-btn" id="searchBtn">Search</button>
                </form>

                <div class="results" id="results">
                    <p class="results-info" id="resultsInfo"></p>
                    <div id="resultsList"></div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </article>
    </main>

    <!-- Chapter Navigation Footer -->
    <nav class="nav-footer" id="navFooter">
        <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous chapter" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Prev</span>
        </button>
        <div class="nav-center">
            <button class="nav-btn nav-media media-active" id="mediaBtn" aria-label="Toggle media">
                <span>Media</span>
            </button>
        </div>
        <button class="nav-btn nav-next" id="nextBtn" aria-label="Next chapter" disabled>
            <span>Next</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </nav>

    <script type="module">
        const TYPES = { w: 'tweet', x: 'text', e: 'email', a: 'article', d: 'document', n: 'note', v: 'voicemail', r: 'recording', A: 'article', T: 'text' };
        const PER_PAGE = 25;
        let docs = [], results = [], page = 1, query = '';

        function parse(d) {
            const [id, mmdd, ta, title, from, snippet] = d;
            const typeChar = ta ? ta[0] : (id[1] || 'x');
            return {
                id: id.replace(/^-/, ''),
                date: mmdd || '',
                type: TYPES[typeChar] || typeChar,
                title: title || '',
                from: from || '',
                snippet: snippet || ''
            };
        }

        async function load() {
            try {
                const response = await fetch('https://anthonyfenech.github.io/otr-files/js/documents.js');
                const text = await response.text();
                const cleaned = text.replace(/export\s*\{[^}]*\}\s*;?\s*$/, '');
                const fn = new Function(cleaned + '; return D;');
                const data = fn();
                docs = data.map(d => parse(d));
                document.getElementById('docCount').textContent = docs.length.toLocaleString() + ' documents';
                console.log('[Go Off] Loaded', docs.length, 'documents');
            } catch(e) {
                console.error('[Go Off] Load error:', e);
                document.getElementById('docCount').textContent = 'Archive unavailable';
            }
        }

        function bold(text) {
            if (!query || !text) return text;
            return text.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')})`, 'gi'), '<strong>$1</strong>');
        }

        function search(q) {
            query = q.toLowerCase().trim();
            if (!query) { document.getElementById('results').classList.remove('visible'); return; }
            results = docs.filter(d =>
                (d.title && d.title.toLowerCase().includes(query)) ||
                (d.from && d.from.toLowerCase().includes(query)) ||
                (d.snippet && d.snippet.toLowerCase().includes(query)) ||
                (d.id && d.id.toLowerCase().includes(query))
            );
            page = 1;
            render();
        }

        function render() {
            const el = document.getElementById('results');
            const list = document.getElementById('resultsList');
            const pag = document.getElementById('pagination');
            const info = document.getElementById('resultsInfo');

            if (!results.length) {
                el.classList.add('visible');
                info.textContent = 'No documents found.';
                list.innerHTML = '';
                pag.innerHTML = '';
                return;
            }

            const start = (page - 1) * PER_PAGE;
            const end = Math.min(start + PER_PAGE, results.length);
            const pages = Math.ceil(results.length / PER_PAGE);

            info.textContent = `Showing ${start + 1} to ${end} of ${results.length} Results.`;

            list.innerHTML = results.slice(start, end).map(d => {
                const typeLabel = d.type ? d.type.charAt(0).toUpperCase() + d.type.slice(1) : '';
                const snippetHtml = d.snippet ? bold(d.snippet) : '';
                return `
                <div class="result">
                    <div class="result-title"><a href="https://anthonyfenech.github.io/otr-files/document.html?id=${d.id}" target="_blank" rel="noopener">${d.title || d.id}</a><span class="result-type"> - ${typeLabel}</span></div>
                    ${snippetHtml ? `<div class="result-snippet">${snippetHtml}</div>` : ''}
                </div>
            `}).join('');

            pag.innerHTML = pages > 1 ? Array.from({length: pages}, (_, i) =>
                `<button class="page-btn${i+1 === page ? ' active' : ''}" data-p="${i+1}">${i+1}</button>`
            ).join('') : '';

            pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                page = +b.dataset.p;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }));

            el.classList.add('visible');
        }

        document.getElementById('searchBtn').addEventListener('click', () => search(document.getElementById('searchInput').value));
        document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(e.target.value); }});
        document.getElementById('themeToggle').addEventListener('click', () => {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
            localStorage.setItem('reader_theme', dark ? 'light' : 'dark');
        });

        load();
    </script>
</body>
</html>
