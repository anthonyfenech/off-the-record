        var s=document.createElement('style');
        s.textContent='*{pointer-events:auto!important}.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]{display:none!important;pointer-events:none!important;visibility:hidden!important;opacity:0!important;z-index:-1!important}body{overflow:auto!important;pointer-events:auto!important}';

        document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.active').forEach(function(el){el.classList.remove('active')});
            document.querySelectorAll('.overlay,.modal,.toc-sidebar,.lightbox-overlay,.photo-modal-overlay,#overlay,#passwordGate,.prompt-overlay,#prompt-modal,[class*="overlay"],[class*="modal"],[class*="lightbox"]').forEach(function(el){

        body {

        /* Sticky header - GPU accelerated */

        /* Section labels */

            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--color-text-muted);
            margin-bottom: 12px;
            margin-top: 40px;
        }

        .section-label:first-of-type {
            margin-top: 0;
        }

        /* Format cards */
        .format-card {
            background: var(--color-bg-secondary, #f5f5f5);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .format-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--color-text);
            margin: 0 0 8px 0;
        }

        .format-description {
            font-family: 'Literata', Georgia, serif;
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            margin: 0 0 12px 0;
            line-height: 1.5;
        }

        .format-detail {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
            margin: 0 0 16px 0;
        }

        .format-detail:empty {
            display: none;
        }

        /* Buttons */
        .format-btn {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 14px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            border: 1.5px solid var(--color-text);
            border-radius: 4px;
            background: var(--color-text);
            color: var(--color-bg);
            cursor: pointer;
            transition: opacity 0.15s ease, background 0.15s ease;
            text-decoration: none;
        }

        .format-btn:hover:not(.inactive):not(.downloading) {
            opacity: 0.8;
        }

        .format-btn:active:not(.inactive):not(.downloading) {
            transform: scale(0.98);
        }

        .format-btn.downloading {
            opacity: 0.6;
            cursor: wait;
        }

        .format-btn.inactive {
            background: var(--color-bg-secondary, #f5f5f5);
            color: var(--color-text-muted);
            border-color: var(--color-border);
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        .format-btn.error {
            background: var(--color-bg-secondary, #f5f5f5);
            color: var(--color-text-muted);
            border-color: var(--color-border);
            opacity: 0.7;
            cursor: default;
            pointer-events: none;
        }

        /* Dark mode adjustments */
        [data-theme="dark"] .format-card {
            background: var(--color-bg-secondary, #2a2a2a);
        }

        [data-theme="dark"] .format-btn {
            background: var(--color-text);
            color: var(--color-bg);
        }

        [data-theme="dark"] .format-btn.inactive,
        [data-theme="dark"] .format-btn.error {
            background: var(--color-bg-secondary, #2a2a2a);
            color: var(--color-text-muted);
        }

        /* Mobile adjustments */

                padding-right: 12px;
            }

                padding: 16px;
            }

    <!-- Render formats from config -->
    <script>
        (function() {
            'use strict';

            var container = document.getElementById('formats-container');
            var downloadingFlags = {};

            // Get reader identification
            function getReaderName() {
                return window.OTR_READER_NAME ||
                       localStorage.getItem('otr_reader_name') ||
                       localStorage.getItem('otr_session_id') ||
                       'anonymous_' + Date.now();
            }

            // Get device type
            function getDeviceType() {
                var width = window.innerWidth;
                if (width <= 480) return 'mobile';
                if (width <= 1024) return 'tablet';
                return 'desktop';
            }

            // Fire analytics event (fire and forget)
            function fireAnalyticsEvent(format) {
                var payload = {
                    event_type: format.eventName,
                    page: 'Download',
                    format: format.id,
                    reader_name: getReaderName(),
                    device: getDeviceType(),
                    timestamp: new Date().toISOString(),
                    referrer: document.referrer || 'direct'
                };

                // Use the site's analytics if available
                if (window.analytics && typeof window.analytics.trackEvent === 'function') {
                    window.analytics.trackEvent(format.eventName, payload);
                }

                // Also send directly to Google Apps Script
                var endpoint = 'https://script.google.com/macros/s/AKfycbz1raPMd46nzBkkhC48PnmixrH-m3_GHzcNLWr830hdcF2EkgE1NGl5Tesaf8XVM59i/exec';
                try {
                    fetch(endpoint, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    // Ignore errors - fire and forget
                }
            }

            // Handle download click
            function handleDownloadClick(format, btn) {
                // Check if already downloading
                if (downloadingFlags[format.id]) return;

                // Set downloading flag
                downloadingFlags[format.id] = true;

                // Update button state
                btn.textContent = format.buttonTextActive;
                btn.classList.add('downloading');

                // Fire analytics event
                fireAnalyticsEvent(format);

                // Trigger file download
                var link = document.createElement('a');
                link.href = format.url;
                link.download = format.filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // After 5 seconds, restore button
                setTimeout(function() {
                    btn.textContent = format.buttonText;
                    btn.classList.remove('downloading');
                    downloadingFlags[format.id] = false;
                }, 5000);
            }

            // Handle link click
            function handleLinkClick(format) {
                // Fire analytics event
                fireAnalyticsEvent(format);

                // Open URL in new tab
                window.open(format.url, '_blank', 'noopener');
            }

            // Create a format card
            function createCard(format) {
                var card = document.createElement('div');
                card.className = 'format-card';
                card.dataset.formatId = format.id;

                var title = document.createElement('h3');
                title.className = 'format-title';
                title.textContent = format.title;

                var desc = document.createElement('p');
                desc.className = 'format-description';
                desc.textContent = format.description;

                var detail = document.createElement('p');
                detail.className = 'format-detail';
                detail.textContent = format.detail || '';

                var btn = document.createElement('button');
                btn.className = 'format-btn';
                btn.type = 'button';

                if (!format.active) {
                    btn.textContent = 'COMING SOON';
                    btn.classList.add('inactive');
                } else {
                    btn.textContent = format.buttonText;

                    if (format.type === 'download') {
                        btn.addEventListener('click', function() {
                            handleDownloadClick(format, btn);
                        });
                    } else if (format.type === 'link') {
                        btn.addEventListener('click', function() {
                            handleLinkClick(format);
                        });
                    }
                }

                card.appendChild(title);
                card.appendChild(desc);
                if (format.detail) {
                    card.appendChild(detail);
                }
                card.appendChild(btn);

                return card;
            }

            // Create section label
            function createSectionLabel(text) {
                var label = document.createElement('div');
                label.className = 'section-label';
                label.textContent = text;
                return label;
            }

            // Render all formats
            function render() {
                var fragment = document.createDocumentFragment();

                // Downloads section
                if (GET_FORMATS.downloads && GET_FORMATS.downloads.length > 0) {
                    fragment.appendChild(createSectionLabel('FILES'));
                    GET_FORMATS.downloads.forEach(function(format) {
                        fragment.appendChild(createCard(format));
                    });
                }

                // Bookstores section
                if (GET_FORMATS.bookstores && GET_FORMATS.bookstores.length > 0) {
                    fragment.appendChild(createSectionLabel('BOOKSTORES'));
                    GET_FORMATS.bookstores.forEach(function(format) {
                        fragment.appendChild(createCard(format));
                    });
                }

                container.appendChild(fragment);
            }

            // Initialize
            render();
        })();
    </script>

    <!-- Sidebar Navigation -->
    <script type="module">
        import { CHAPTERS, getChaptersByYear, getIntroChapters, getPostscriptChapters, getSortedYears } from './data/chapters.js';
        import { isChapterComplete } from './js/storage.min.js';

        const menuBtn = document.getElementById('menuBtn');
        const closeTocBtn = document.getElementById('closeTocBtn');
        const tocSidebar = document.getElementById('tocSidebar');
        const overlay = document.getElementById('overlay');
        const tocContent = document.getElementById('tocContent');

        // Build TOC
        buildTOC();

        function openTOC() {
            // Always collapse book section when opening
            expandedSections.delete('book');
            const bookContent = document.getElementById('toc-book-content');
            const bookSection = tocContent.querySelector('[data-section="book"]');
            if (bookContent) bookContent.classList.add('collapsed');
            if (bookSection) bookSection.querySelector('.toc-top-header')?.classList.remove('expanded');

            tocSidebar.style.visibility = 'visible';
            tocSidebar.style.transform = '';
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '';
            tocSidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeTOC() {
            tocSidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (!tocSidebar.classList.contains('open')) {
                    tocSidebar.style.visibility = 'hidden';
                    overlay.style.visibility = 'hidden';
                }
            }, 310);
        }

        menuBtn.addEventListener('click', openTOC);
        closeTocBtn.addEventListener('click', closeTOC);
        overlay.addEventListener('click', closeTOC);

        closeTocBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            closeTOC();
        });
        overlay.addEventListener('touchstart', (e) => {
            e.preventDefault();
            closeTOC();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && tocSidebar.classList.contains('open')) {
                closeTOC();
            }
        });

        function buildTOC() {
            const fragment = document.createDocumentFragment();

            // BOOK section
            fragment.appendChild(createBookSection());

            // BINGE MODE link
            fragment.appendChild(createTopSection({ id: 'binge-mode', label: 'BINGE MODE', type: 'link', url: './binge-mode.html', current: false }));

            // DOWNLOAD link (current page - highlighted)
            fragment.appendChild(createTopSection({ id: 'download', label: 'DOWNLOAD', type: 'link', url: './downloadpage.html', current: true }));

            // Divider
            const divider = document.createElement('div');
            divider.className = 'toc-divider';
            fragment.appendChild(divider);

            tocContent.appendChild(fragment);
        }

        function createBookSection() {
            const section = document.createElement('div');
            section.className = 'toc-top-section';
            section.dataset.section = 'book';

            const sectionHeader = document.createElement('div');
            sectionHeader.className = 'toc-top-header';

            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'toc-top-title';
            sectionTitle.textContent = 'OFF-THE-RECORD';

            sectionHeader.appendChild(sectionTitle);

            const bookContent = document.createElement('div');
            bookContent.className = 'toc-book-content collapsed';
            bookContent.id = 'toc-book-content';

            buildBookContent(bookContent);

            sectionHeader.addEventListener('click', () => {
                toggleTopSection('book', sectionHeader, bookContent);
            });

            section.appendChild(sectionHeader);
            section.appendChild(bookContent);

            return section;
        }

        function buildBookContent(container) {
            const frontMatter = CHAPTERS.filter(c => c.section === 'title' || c.section === 'toc');
            const introChapters = getIntroChapters();
            const chaptersByYear = getChaptersByYear();
            const years = getSortedYears();
            const postscriptChapters = getPostscriptChapters();

            frontMatter.forEach(chapter => {
                container.appendChild(createChapterItem(chapter));
            });

            introChapters.forEach(chapter => {
                container.appendChild(createChapterItem(chapter));
            });

            years.forEach(year => {
                const chapters = chaptersByYear[year] || [];
                chapters.forEach(chapter => {
                    container.appendChild(createChapterItem(chapter));
                });
            });

            postscriptChapters.forEach(chapter => {
                container.appendChild(createChapterItem(chapter));
            });
        }

        function createChapterItem(chapter) {
            const item = document.createElement('div');
            item.className = 'toc-chapter';
            item.dataset.chapterId = chapter.id;

            const lockedChapters = JSON.parse(localStorage.getItem('admin_lockedChapters') || '[]');
            const isLocked = lockedChapters.includes(chapter.id);

            if (isLocked) {
                item.classList.add('toc-chapter-locked');
            }

            const indicator = document.createElement('div');
            indicator.className = 'chapter-indicator';

            const info = document.createElement('div');
            info.className = 'toc-chapter-info';

            const titleRow = document.createElement('div');
            titleRow.className = 'toc-chapter-title-row';

            const title = document.createElement('span');
            title.className = 'toc-chapter-title';
            title.textContent = chapter.title;

            titleRow.appendChild(title);

            if (isLocked) {
                const lockIcon = document.createElement('span');
                lockIcon.className = 'toc-lock-icon';
                lockIcon.textContent = '🔒';
                titleRow.appendChild(lockIcon);
            }

            info.appendChild(titleRow);

            item.appendChild(indicator);
            item.appendChild(info);

            const handleChapterSelect = () => {
                if (!isLocked) {
                    closeTOC();
                    window.location.href = './?chapter=' + chapter.id;
                }
            };
            item.addEventListener('click', handleChapterSelect);
            item.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleChapterSelect();
            });

            if (isChapterComplete(chapter.id)) {
                item.classList.add('completed');
                indicator.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            }

            return item;
        }

        function createTopSection(section) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'toc-top-section';
            sectionDiv.dataset.section = section.id;

            const sectionHeader = document.createElement('div');
            sectionHeader.className = 'toc-top-header toc-top-link';

            if (section.current) {
                sectionHeader.style.background = 'var(--color-bg-hover)';
                sectionHeader.style.fontWeight = 'bold';
            }

            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'toc-top-title';
            sectionTitle.textContent = section.label;

            sectionHeader.appendChild(sectionTitle);

            if (!section.current) {
                sectionHeader.addEventListener('click', () => {
                    closeTOC();
                    window.location.href = section.url;
                });
            } else {
                sectionHeader.style.cursor = 'default';
            }

            sectionDiv.appendChild(sectionHeader);
            return sectionDiv;
        }

        const expandedSections = new Set();
        function toggleTopSection(sectionId, sectionHeader, sectionContent) {
            if (expandedSections.has(sectionId)) {
                expandedSections.delete(sectionId);
                sectionContent.classList.add('collapsed');
                sectionHeader.classList.remove('expanded');
            } else {
                expandedSections.add(sectionId);
                sectionContent.classList.remove('collapsed');
                sectionHeader.classList.add('expanded');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('otr_beta_session');
            window.location.href = './';
        });
    </script>

    <!-- Theme Toggle -->
    <script>
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            themeToggle.addEventListener('click', function() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('reader_theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('reader_theme', 'dark');
                }
            });
        })();
    </script>
