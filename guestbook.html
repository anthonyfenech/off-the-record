<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Sign the guestbook - OFF-THE-RECORD">
    <meta name="theme-color" content="#333333">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OFF-THE-RECORD">

    <title>Comments - OFF-THE-RECORD</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./assets/icons/tab-logo.svg">

    <!-- Google Fonts - Literata for body text -->
    
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="./fonts/literata-regular.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Self-hosted fonts (no external request) -->
    <link rel="stylesheet" href="./css/fonts.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/reset.min.css">
    <link rel="stylesheet" href="./css/variables.min.css">
    <link rel="stylesheet" href="./css/typography.css">
    <link rel="stylesheet" href="./css/layout.min.css">
    <link rel="stylesheet" href="./css/components.min.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="header" id="header">
        <div class="header-content">
            <a href="./" class="back-link" aria-label="Back to book">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <a href="./" class="header-logo"><img src="./assets/icons/OTR-header.png" alt="OFF-THE-RECORD" class="header-logo-img"></a>
            <div style="width: 44px;"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="reader" id="reader">
        <article class="chapter">
            <header class="chapter-header">
                <h2 class="chapter-title">COMMENTS</h2>
            </header>
            <div class="guestbook-page" id="guestbookContainer">
                <!-- Guestbook content rendered by JS -->
            </div>
        </article>
    </main>

    <!-- Scripts -->
    <script type="module">
        import { guestbook } from './js/guestbook.min.js';

        // Initialize guestbook on page load
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('guestbookContainer');
            if (container) {
                guestbook.render(container);
            }
        });
    </script>
</body>
</html>
